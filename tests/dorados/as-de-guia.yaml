# As de guía: una gaza fija en la punta de la cuerda. Borrador de la skill nudo-nuevo.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa, z hacia arriba.
# El firme llega desde el fondo de la mesa y no se mueve. El ojo pequeño queda a su
# izquierda, con el cruce 1 en su esquina de arriba a la derecha; la gaza grande cuelga
# hacia quien ata.
slug: as-de-guia
nombre: As de guía
familia: Gazas
abok: 1010

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Hace una gaza fija en la punta de una cuerda: no se cierra ni se corre cuando tiras. Sirve
  para pasar la cuerda alrededor de un árbol o un poste, colgar algo de un gancho o tener
  una manija firme en la punta. Aunque se haya cargado mucho, se desata fácil.
materiales: >-
  Una cuerda de 1 a 2 m y de 6 a 10 mm de grosor, que no sea rígida.
verificacion:
  - El chicote rodea el firme por detrás, como un collar, y vuelve a bajar por el ojo junto
    al tramo que subió.
  - El ojo aprieta juntos los dos tramos del chicote.
  - El chicote termina dentro de la gaza grande, al lado de ella.
  - Al chicote le queda al menos un palmo después del nudo.
  - Si tiras del firme y de la gaza a la vez, la gaza no cambia de tamaño.
precauciones:
  - Mientras no tiene carga, o si la carga va y viene, se puede aflojar. Apriétalo bien y
    revísalo antes de usarlo.
  - En una cuerda rígida o resbalosa se suelta con más facilidad. Deja el chicote largo y
    remátalo con un nudo simple alrededor de la gaza.
  - Mientras está cargado no se puede desatar. Quita primero la carga.
alternativas:
  - nudo: Ocho doble
    cuando: >-
      Cuando la gaza tiene que aguantar sin que nadie la revise: no se afloja sola, aunque
      cuesta más desatarlo después de cargarlo.
  - nudo: Mariposa alpina
    cuando: Cuando necesitas una gaza fija en medio de la cuerda y no en la punta.
  - nudo: As de guía español
    cuando: Cuando necesitas dos gazas fijas en vez de una.
seguridad: >-
  El as de guía se conoce como nudo de rescate, pero en las actividades del grupo no se usa
  para sostener, subir ni bajar a una persona. Su uso con personas solo se practica con un
  instructor y equipo certificados.

# Zona que se muestra en todos los pasos.
encuadre:
  x: [-10.0, 7.5]
  y: [-14.5, 13.5]

segmentos:
  # El firme baja desde el fondo de la mesa hasta el cruce 1, cerca de (0, 0).
  firme: [[0, 20], [0, 16], [0.05, 12], [0.1, 8], [0.1, 4.5], [0.05, 2.0]]
  # El ojo: desde el cruce 1 baja por la derecha, sigue por abajo hacia la izquierda, sube
  # y vuelve por arriba al cruce 1, por encima del firme.
  ojo: [[0.2, -1.5], [-0.4, -3.6], [-2.0, -5.0], [-4.0, -5.1], [-5.6, -4.0], [-6.2, -2.0],
        [-5.6, -0.2], [-4.0, 0.7], [-2.0, 0.6], [-0.5, 0.3]]
  # La gaza grande: sale del cruce 1 hacia la derecha, da la vuelta por abajo y llega
  # debajo del ojo.
  gaza: [[1.6, -0.8], [3.2, -2.5], [4.0, -5.5], [3.6, -9.0], [1.5, -12.0], [-1.5, -12.8],
         [-4.0, -11.5], [-4.8, -9.0], [-4.4, -7.0]]
  # El chicote sube por el ojo: por debajo de su lado de abajo y por encima del de arriba.
  sube: [[-4.1, -3.0], [-4.0, -0.5], [-3.9, 2.2]]
  # Sube a la izquierda del firme y pasa por detrás de él.
  vuelta: [[-3.8, 4.5], [-3.4, 7.5], [-2.0, 9.8], [0.0, 10.6], [2.0, 10.4]]
  fuera-4: [[4.0, 10.5], [6.0, 10.6]]
  # Baja por la derecha, cruza por encima del firme y baja por el ojo a la derecha del
  # tramo que subió.
  baja: [[3.4, 9.0], [3.5, 6.8], [2.4, 4.8], [0.6, 3.4], [-1.2, 2.2], [-2.0, 0.9],
         [-2.1, -1.5], [-2.1, -3.5], [-2.1, -6.5], [-2.0, -8.5]]

pasos:
  - titulo: Prepara la cuerda
    texto: >-
      Pon la cuerda sobre la mesa con el tramo largo, el firme, hacia el fondo. El extremo
      que vas a mover es el chicote. Deja chicote para la gaza que quieres y un palmo más.
    trazado: [firme, gaza]
    secuencia: ""

  - titulo: Haz un ojo pequeño
    texto: >-
      Donde quieres el nudo, haz en el firme un ojo pequeño. El tramo que va hacia el
      chicote pasa por encima del firme.
    trazado: [firme, ojo, gaza]
    secuencia: "1U 1O"
    resaltar: {desde: "ojo[0]", hasta: fin}

  - titulo: Sube el chicote por el ojo
    texto: >-
      Pasa el chicote por el ojo de abajo hacia arriba: entra por debajo del ojo y sale por
      encima, a la izquierda del firme.
    trazado: [firme, ojo, gaza, sube, "vuelta[:1]"]
    secuencia: "1U 2O 3U 1O 2U 3O"
    resaltar: {desde: "gaza[-1]", hasta: fin}

  - titulo: Rodea el firme por detrás
    texto: >-
      Lleva el chicote hacia arriba y pásalo por detrás del firme, de izquierda a derecha.
    trazado: [firme, ojo, gaza, sube, vuelta, fuera-4]
    secuencia: "4O 1U 2O 3U 1O 2U 3O 4U"
    resaltar: {desde: "vuelta[0]", hasta: fin}

  - titulo: Baja otra vez por el ojo
    texto: >-
      Cruza el chicote por delante del firme y bájalo por el ojo, al lado del tramo que
      subió. Sujeta juntos el chicote y la gaza, y tira del firme para apretar.
    trazado: [firme, ojo, gaza, sube, vuelta, baja]
    secuencia: "4O 5U 1U 7O 2O 3U 6U 1O 2U 3O 4U 5O 6O 7U"
    resaltar: {desde: "baja[0]", hasta: fin}

# El error más común: el ojo hecho al revés, con el firme por encima.
error:
  paso: 2
  invierte: [1]
  titulo: El ojo al revés
  texto: >-
    El firme quedó por encima del ojo. Así el nudo no traba y se deshace cuando tiras.
    Deshaz el ojo y vuelve a hacerlo con el tramo que va hacia el chicote por encima.
  encuadre:
    x: [-8.0, 5.0]
    y: [-7.5, 4.5]
  otros:
    - titulo: El chicote por delante del firme
      texto: >-
        Si en el paso 4 pasas el chicote por delante del firme y no por detrás, no lo
        rodea y el nudo se suelta. Revisa que el chicote abrace el firme como un collar.
    - titulo: El chicote muy corto
      texto: >-
        Con menos de un palmo de chicote, al apretar se sale del ojo. Deshazlo y empieza
        con más chicote.

terminado:
  encuadre:
    x: [-8.0, 6.5]
    y: [-11.0, 13.0]

# Estado de producción (ver «Estado» en docs/formato-spec.md).
estado: borrador
