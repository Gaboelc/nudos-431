  paso: 3
  invierte: [3, 4]
  titulo: El segundo lazo quedó debajo
  texto: >-
    El lazo de la derecha quedó debajo del de la izquierda. Así, al sacar las gazas, el nudo
    se deshace. Vuelve a ponerlo, esta vez encima del primero.
