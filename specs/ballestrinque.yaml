# Ballestrinque sobre un poste, hecho con el chicote. Es el primer nudo sobre un anfitrión.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa, z hacia arriba.
# El poste va a lo largo de x, con el eje en y = 0. Sobre el poste, los puntos son
# [x, ángulo]: 0° arriba, 90° hacia quien ata, 180° abajo y 270° atrás.
slug: ballestrinque
nombre: Ballestrinque
familia: De sujeción
abok: 1245

usos: >-
  Sujeta una cuerda a un poste, un tubo o una baranda. Con él empiezan y terminan muchos
  amarres. Se hace rápido y se afloja fácil para correrlo o deshacerlo.
materiales: >-
  Una cuerda de 1 a 2 m y un palo redondo, como el de una escoba.
verificacion:
  - Por delante, la diagonal cruza por encima del firme y del chicote, como una X.
  - El firme y el chicote salen por debajo de la diagonal, hacia lados opuestos.
  - Por detrás se ven dos vueltas paralelas, una junto a la otra.
  - Al tirar del firme, las vueltas aprietan el poste y el nudo no se corre.
# Texto propio. Pendiente: que Gabriel lo revise.
precauciones:
  - Si la carga tira hacia distintos lados o el poste gira, se puede correr y soltar. No lo
    dejes solo cuando importa que aguante; remátalo con un cote.
  - Si le haces varias vueltas seguidas para asegurarlo, con mucha carga las primeras se
    aprietan tanto que después no se pueden desatar.
  - >-
    No lo uses para amarrar algo que tira con fuerza y cambia de dirección, como un bote:
    se suelta.
alternativas:
  - nudo: Media llave y dos cotes
    cuando: >-
      Cuando la cuerda va a quedar atada mucho tiempo o la carga cambia de dirección: no se
      corre y se desata fácil.
  - nudo: Ballestrinque doble
    cuando: Cuando la carga tira a lo largo del poste o de otra cuerda; en ese sentido no se corre.
  - nudo: Constrictor
    cuando: >-
      Cuando quieres apretar algo y que no se afloje, como la boca de una bolsa: aguanta
      mucho más, pero cuesta desatarlo.

anfitrion:
  tipo: poste
  radio: 1.5
  desde: -14
  hasta: 14

# Zona que se muestra en todos los pasos.
encuadre:
  x: [-6.0, 6.0]
  y: [-7.0, 7.5]

segmentos:
  firme: [[16, -12.5], [10, -12.8], [5, -11.8], [2.2, -9.2], [0.9, -6.2], [0.6, -4.0]]
  punta-1: [[0.55, -2.9]]
  # Primera vuelta: sube por delante, pasa por arriba, por detrás y por debajo, y vuelve
  # hacia quien ata a la derecha del firme.
  vuelta-1:
    poste: [[0.6, 100], [0.6, 60], [0.75, 0], [0.95, -60], [1.2, -120], [1.45, -180],
            [1.7, -230], [1.8, -262]]
  # En los pasos 2 y 4 el chicote sale por debajo del poste, directo sobre la mesa.
  chicote-2: [[1.6, -2.7], [2.5, -4.7], [3.9, -5.9]]
  # Diagonal: cruza por delante, por encima del firme, y sube otra vez por arriba.
  diagonal:
    poste: [[1.3, -285], [0.6, -305], [-0.4, -330], [-1.3, -352], [-1.7, -372]]
  # Segunda vuelta, a la izquierda de la primera.
  vuelta-2:
    poste: [[-1.8, -400], [-1.85, -450], [-1.9, -500], [-1.95, -540], [-2.0, -585],
            [-2.05, -620]]
  atras-3: [[-2.0, 4.2], [-2.3, 6.4]]
  chicote-4: [[-2.1, -2.7], [-2.8, -4.7], [-4.1, -5.9]]
  # El chicote sube por debajo de la diagonal, entre las dos vueltas, y sale hacia atrás.
  metido:
    poste: [[-1.6, -645], [-1.0, -665], [-0.6, -690], [-0.5, -715], [-0.5, -745],
            [-0.55, -775]]
  atras-5: [[-0.6, 4.0], [-0.75, 6.4]]

pasos:
  - titulo: Prepara la cuerda
    texto: >-
      Pon la cuerda frente al poste. El tramo largo es el firme; el extremo que vas a
      mover es el chicote.
    trazado: [firme, punta-1]
    secuencia: ""

  - titulo: Da la primera vuelta
    texto: >-
      Pasa el chicote por encima del poste, por detrás y por debajo. Tráelo hacia ti a
      la derecha del firme.
    trazado: [firme, "vuelta-1[0:6]", chicote-2]
    secuencia: ""
    resaltar: {desde: "vuelta-1[0]", hasta: fin}

  - titulo: Cruza por encima del firme
    texto: >-
      Cruza el chicote en diagonal por encima del firme, hacia la izquierda, y pásalo
      otra vez por encima del poste.
    trazado: [firme, vuelta-1, diagonal, "vuelta-2[0:2]", atras-3]
    secuencia: "1U 1O"
    resaltar: {desde: "diagonal[0]", hasta: fin}

  - titulo: Da la segunda vuelta
    texto: >-
      Baja el chicote por detrás y pásalo por debajo del poste, a la izquierda de la
      primera vuelta. Tráelo hacia ti.
    trazado: [firme, vuelta-1, diagonal, "vuelta-2[0:4]", chicote-4]
    secuencia: "1U 1O"
    resaltar: {desde: "vuelta-2[1]", hasta: fin}

  - titulo: Mételo bajo la diagonal
    texto: >-
      Sube el chicote por debajo de la diagonal, entre las dos vueltas, y sácalo hacia
      atrás por encima del poste. Tira del firme y del chicote para ajustar.
    trazado: [firme, vuelta-1, diagonal, vuelta-2, metido, atras-5]
    secuencia: "1U 1O 2O 2U"
    resaltar: {desde: "metido[0]", hasta: fin}

# El error más común: el chicote pasa por encima de la diagonal, no por debajo.
error:
  paso: 5
  invierte: [2]
  titulo: El chicote por encima de la diagonal
  texto: >-
    Pasaste el chicote por encima de la diagonal. Así no queda atrapado y el nudo se
    suelta al tirar. Sácalo y vuelve a pasarlo por debajo.
  encuadre:
    x: [-3.5, 3.5]
    y: [-4.5, 3.5]

terminado:
  encuadre:
    x: [-4.5, 4.5]
    y: [-6.0, 6.0]

# Los filtros humanos. El filtro 2 está en pausa desde el 9 de noviembre de 2026.
filtros:
  - filtro: 1
    fecha: 2026-11-09
    resultado: aprobado
    ficha: ed9ac1e
