# Pescador: une dos cuerdas del mismo grosor con un nudo simple de cada una alrededor de la
# otra. Borrador de la skill nudo-nuevo. Trazado propio: la fuente es la página 01 del
# manual de la Tropa (dibujos 1 a 5), y el método, el de las fotos del pescador doble con
# una sola vuelta. Solo se usaron para leer la topología.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa.
slug: pescador
nombre: Pescador
otros_nombres: [pescador simple]
familia: De unión
# Sin confirmar.
abok: 1414

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Une dos cuerdas del mismo grosor, sobre todo si son delgadas o resbalosas, como dos
  sedales o dos cordeles, donde un rizo se soltaría. También une cuerdas tiesas.
materiales: >-
  Dos cuerdas del mismo grosor, de 1 m y de colores distintos. Para aprender, de 6 a
  10 mm y que no sean rígidas.
verificacion:
  - Cada cuerda tiene un nudo simple que abraza a la otra.
  - Los dos nudos quedan juntos, uno contra el otro.
  - Cada chicote sale hacia afuera, junto al firme de la otra cuerda.
  - Al tirar de los dos firmes, los nudos se traban y no se separan.
  - A cada chicote le sobra por lo menos el ancho de tu mano.
precauciones:
  - >-
    Apretado, y más si estuvo cargado o se mojó, cuesta mucho desatarlo. Si lo vas a tener
    que desatar, usa otro nudo.
  - >-
    Con cuerdas muy resbalosas, como las de nailon liso, se puede correr. Revisa que los
    dos nudos sigan juntos antes de volver a tirar.
alternativas:
  - nudo: Pescador doble
    cuando: >-
      Cuando las cuerdas son resbalosas o la unión tiene que aguantar más: cada cuerda da
      dos vueltas antes de pasar el chicote.
  - nudo: Vuelta de escota
    cuando: Cuando las cuerdas son de distinto grosor o la vas a desatar después.
  - nudo: Rizo
    cuando: Para atar apretado alrededor de algo, como un paquete o una venda.

# Estado de producción (ver «Estado» en docs/formato-spec.md).
estado: borrador

cuerdas:
  - {nombre: azul, grosor: 1, color: azul}
  - {nombre: crema, grosor: 1, color: crema}

encuadre:
  x: [-11.3, 11.3]
  y: [-5.0, 5.0]

# Tallado: las dos cuerdas van lado a lado, a 1,3 diámetros, y cada nudo simple es una
# vuelta cerrada alrededor de las dos, con esquinas de radio 1,8 y un gancho de radio 1,6.
# Con radio 1,5 la cuerda entera quedaba encogida casi 2 % y el error común se enroscaba
# en el gancho. La otra cuerda pasa entre el chicote y la rama que vuelve, que van a 3,2
# diámetros para que tenga lugar. El nudo de la crema es el de la azul girado media vuelta
# alrededor del centro, con los mismos encima/debajo: los dos tienen la misma mano. Los
# pasos 2 a 5 atan los nudos separados y el 6 los junta: cada nudo se corre 2 diámetros,
# y las dos ramas que vuelven quedan a 1,5.
