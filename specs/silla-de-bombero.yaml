    x: [-7.5, 7.5]
    y: [-6.5, 4.0]
  otros:
    - titulo: Los cotes flojos
      texto: >-
        Si el lazo del firme queda suelto alrededor de la gaza, la gaza se corre al cargarla.
        Lleva cada cote hasta el nudo y ciérralo tirando del firme.

