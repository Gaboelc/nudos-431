[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nudos"
version = "0.1.0"
description = "Libro de nudos del Grupo 431: de la especificación de cada nudo a sus modelos"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["nudos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
