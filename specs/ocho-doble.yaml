pasos:
  - titulo: Dobla la cuerda
    texto: >-
      Dobla el extremo de la cuerda en un seno largo, con los dos tramos juntos. El
      tramo largo es el firme y el corto, el chicote. Deja doblados unos 90 cm.
    trazado: [firme, doble-ida, baja-ida, seno-1, baja-regreso, doble-regreso]
    secuencia: ""

  - titulo: Haz una vuelta
    texto: >-
      Con la cuerda doble, forma una vuelta: lleva el seno hacia abajo y a la izquierda, y
      regrésalo por debajo del firme. Las dos cuerdas van siempre juntas.
    trazado: [firme, doble-ida, vuelta-abierta-ida, sale-ida, seno-2, sale-regreso, vuelta-abierta-regreso, doble-regreso]
    secuencia: "1O 2O 3U 1U 2U 4U 4O 3O"
    resaltar: {desde: "vuelta-abierta-ida[0]", hasta: "vuelta-abierta-regreso[-1]"}

  - titulo: Rodea el firme
    texto: >-
      Sube con el seno por la derecha y cruza el firme por encima, hacia la izquierda,
      arriba de la vuelta.
    trazado: [firme, doble-ida, vuelta-abierta-ida, rodeo-ida, lado-ida, seno-3, lado-regreso, rodeo-regreso, vuelta-abierta-regreso, doble-regreso]
    secuencia: "5U 6U 1O 2O 3U 1U 6O 7O 8O 5O 2U 4U 4O 3O 7U 8U"
    resaltar: {desde: "rodeo-ida[0]", hasta: "rodeo-regreso[-1]"}

  - titulo: Pasa el seno por la vuelta
    texto: >-
      Baja con el seno y pásalo por la vuelta del paso 2: entra por debajo y sale por
      encima. El seno que sale es la gaza. Acomoda las cuerdas juntas y aprieta.
    trazado: [firme, doble-ida, vuelta-ida, rodeo-ida, pasa-ida, gaza, pasa-regreso, rodeo-regreso, vuelta-regreso, doble-regreso]
    secuencia: "5U 6U 1O 2O 9U 10U 11O 12O 3U 1U 6O 7O 12U 13U 14O 9O 10O 15O 16U 11U 8O 5O 2U 4U 13O 16O 15U 14U 4O 3O 7U 8U"
    # Empieza antes de la vuelta: el seno llega resaltado y la vuelta, azul. Es lo que
    # compara la imagen del error.
    resaltar: {desde: "pasa-ida[0]", hasta: "pasa-regreso[-1]"}

# El error más común: pasar el seno por la vuelta al revés. Es el paso 4 con los ocho
# cruces de la pasada por la vuelta invertidos, y sale un nudo simple con la cuerda doble.
error:
  paso: 4
  invierte: [9, 10, 11, 12, 13, 14, 15, 16]
  titulo: El seno entró por encima
  texto: >-
    El seno entró a la vuelta por encima y salió por debajo. Así no sale un ocho, sino un
    nudo simple con la cuerda doble, que queda más chico y cuesta mucho desatar. Sácalo y
    vuelve a pasarlo: entra por debajo y sale por encima.
  encuadre:
    x: [-10.0, 5.0]
    y: [-10.0, 6.0]
  otros:
    - titulo: Las cuerdas cruzadas
      texto: >-
        Si las dos cuerdas se cruzan entre ellas, el nudo aguanta menos y cuesta revisarlo.
        Acomódalas antes de apretar.

# El nudo terminado se muestra por delante y por detrás, con el comienzo de la gaza.
terminado:
  encuadre:
    x: [-13.0, 11.0]
    y: [-18.5, 14.0]
