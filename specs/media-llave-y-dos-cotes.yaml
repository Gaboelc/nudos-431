pasos:
  - titulo: Prepara la cuerda
    texto: >-
      Pon la cuerda frente al poste. El tramo largo, hacia ti, es el firme; el extremo junto
      al poste es el chicote. Deja un chicote de 1 m.
    trazado: [firme, punta-1]
    secuencia: ""

  - titulo: Da dos vueltas al poste
    texto: >-
      Pasa el chicote por debajo del poste, súbelo por detrás y bájalo por delante. Da otra
      vuelta igual, a la izquierda, y trae el chicote hacia ti. Esta media llave aguanta el
      tirón mientras sigues.
    trazado: [firme, vueltas, bajada, punta-2]
    secuencia: ""
    resaltar: {desde: "vueltas[0]", hasta: fin}

  - titulo: Rodea el firme
    texto: >-
      Cruza el chicote por encima del firme, hacia la derecha. Dale la vuelta y regrésalo
      por debajo del firme, más cerca del poste.
    trazado: [firme, vueltas, bajada, rodea, punta-3]
    secuencia: "1U 2O 1O 2U"
    resaltar: {desde: "rodea[9]", hasta: fin}

  - titulo: Cierra el primer cote
    texto: >-
      Sigue hacia la izquierda y pasa el chicote por encima del tramo que baja del poste.
      Ajusta el cote contra las vueltas.
    trazado: [firme, vueltas, bajada, rodea, cierra, punta-4]
    secuencia: "1U 2O 3U 1O 2U 3O"
    resaltar: {desde: "cierra[0]", hasta: fin}

  - titulo: Haz el segundo cote
    texto: >-
      Haz otro cote igual, más cerca de ti y hacia el mismo lado: por encima del firme, por
      debajo y por encima del tramo que llega del primero. Júntalos y tira del firme.
    trazado: [firme, vueltas, bajada, rodea, cierra, arco]
    secuencia: "4U 5O 1U 2O 3U 1O 2U 3O 6U 4O 5U 6O"
    resaltar: {desde: "arco[0]", hasta: fin}

# El error: info.txt dice que los cotes van siempre hacia el mismo lado. Si el segundo
# gira al revés, sus tres cruces quedan invertidos y los cotes no forman un ballestrinque.
error:
  paso: 5
  invierte: [4, 5, 6]
  titulo: El segundo cote gira al revés
  texto: >-
    Hiciste el segundo cote hacia el otro lado: pasaste el chicote por debajo del firme
    primero. Así los cotes se aflojan al tirar. Deshazlo y empieza otra vez por encima del
    firme, como el primero.
  otros:
    - titulo: Los cotes alrededor de las vueltas
      texto: >-
        Los cotes van alrededor del firme, lejos del poste. Si rodean también las vueltas,
        las vueltas no pueden aguantar el tirón y el nudo se aprieta tanto que cuesta
        desatarlo.
  encuadre:
    x: [-8.5, 4.5]
    y: [-16.5, -6.0]

terminado:
  encuadre:
    x: [-9.0, 5.0]
    y: [-17.0, 4.0]

# Estado de producción (ver «Estado» en docs/formato-spec.md).
estado: borrador
