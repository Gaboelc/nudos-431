pasos:
  - titulo: Haz dos gazas
    texto: >-
      Con el firme abajo a la izquierda, haz una gaza a la izquierda, con el firme por encima,
      y otra a la derecha, que gire igual. El resto es el chicote.
    trazado: [firme, gazas]
    secuencia: "1O 1U 2O 2U"
    resaltar: {desde: "gazas[0]", hasta: fin}

  - titulo: Rodea el firme
    texto: >-
      Lleva el chicote por detrás del firme y tráelo por delante. La gaza de la derecha queda
      bajo la de la izquierda.
    trazado: [firme, rodea-firme, pasada-1, rodea]
    secuencia: "4U 1O 3O 2O 1U 3U 2U 4O"
    resaltar: {desde: "pasada-1[41]", hasta: fin}

  - titulo: Teje el chicote
    texto: >-
      Lleva el chicote por fuera de la gaza de la derecha y vuelve por el medio: por debajo,
      por encima, por debajo y por encima.
    trazado: [firme, pasada-0, pasada-1, teje, sale]
    secuencia: "4U 1O 6U 3O 8U 2O 1U 5O 3U 7O 2U 4O 5U 6O 7U 8O"
    resaltar: {desde: "teje[13]", hasta: fin}

  - titulo: Empieza a seguir la cuerda
    texto: >-
      Mete el chicote junto al firme y síguelo siempre del mismo lado, sin cruzarlo: por
      encima y por debajo donde él pasa.
    trazado: [firme, pasada-0, pasada-1, teje, vuelve, sigue-1]
    secuencia: "4U 1O 16O 6U 3O 8U 2O 10U 1U 5O 3U 12U 7O 14U 2U 9O 4O 5U 6O 11O 7U 13O 8O 9U 10O 15O 11U 12O 13U 14O 15U 16U"
    resaltar: {desde: "vuelve[0]", hasta: fin}

  - titulo: Termina de seguirla
    texto: >-
      Sigue hasta dar la vuelta entera. Todo el nudo queda doble, con las cuerdas juntas.
    trazado: [firme, pasada-0, pasada-1, teje, vuelve, sigue-1, sigue-2, chicote]
    secuencia: "4U 24U 1O 16O 27U 6U 18O 3O 8U 32U 2O 22O 10U 1U 25O 5O 3U 12U 7O 30O 14U 2U 9O 4O 5U 17U 6O 11O 20U 7U 13O 8O 9U 23U 10O 15O 28U 11U 19O 12O 13U 31U 14O 21O 15U 16U 26O 17O 18U 19U 20O 29O 21U 22U 23O 24O 25U 26U 27O 28O 29U 30U 31O 32O"
    resaltar: {desde: "sigue-2[0]", hasta: fin}

# El error más común (lo eligió Gabriel): rodear el firme al revés en el paso 2, primero por
# delante y después por detrás. La gaza de la derecha queda encima de la de la izquierda y el
# chicote, bajo el firme.
error:
  paso: 2
  invierte: [3, 4]
  titulo: Rodear el firme al revés
  texto: >-
    El chicote pasó primero por delante del firme. La gaza de la derecha queda encima y
    ningún tejido sale bien. Vuelve a las dos gazas y rodea el firme primero por detrás.
  encuadre:
    x: [-7.5, 7.0]
    y: [-7.5, 7.0]
  otros:
    - titulo: Empezar a tejer por encima
      texto: >-
        Al tejer, el chicote empieza por debajo. Si empieza por encima, el nudo no se traba.
    - titulo: Cruzar la primera pasada
      texto: >-
        Al seguir la cuerda, el chicote va siempre del mismo lado. Si la cruza o cambia de
        lado, el nudo pierde su forma.
    - titulo: Apretar de una vez
      texto: >-
        Si tiras fuerte de un extremo, el anillo se deforma. Apriétalo de a poco, siguiendo la
        cuerda.

terminado:
  encuadre:
    x: [-8.0, 7.0]
    y: [-8.0, 7.0]
