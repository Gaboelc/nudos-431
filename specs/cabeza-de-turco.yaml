# Cabeza de turco de 3 cabos y 4 senos, atada plana sobre la mesa (método plano de T8, aprobado
# por Gabriel el 23 nov de 2026). Borrador de la skill nudo-nuevo, pasos 1 a 5. Trazado propio:
# los dibujos de la fuente solo se usaron para leer los cruces.
#
# La forma de los pasos 3 a 5 sale de la sombra de la cabeza de turco 3 × 4: la curva
# r = 4 + 2 cos(4t/3), con t como ángulo, dada tres veces alrededor del centro. La primera
# pasada va a 0,6 diámetros por un lado de esa curva y la segunda, a 0,6 por el otro, siempre
# del mismo lado, así que cada cruce del paso 3 son cuatro cruces del paso 5. El firme entra y
# el chicote sale por el mismo seno de afuera. Al terminar, el chicote queda dentro de ese
# seno: para salir por fuera tendría que cruzar la primera pasada.
#
# En el paso 2, los cruces 1 y 2 cambian de orden a lo largo de la línea entre las gazas, como
# en el dibujo. Para que ninguno se mueva más de 2,5 diámetros entre pasos, en los pasos 1 y 2
# van juntos, cerca del seno de adentro; en el paso 3 se separan hasta su lugar.
#
# Falta el paso 6, «Dale forma de anillo»: enrolla el nudo plano del paso 5 en un anillo parado
# sobre la mesa, con los mismos 32 cruces. Necesita código nuevo, que todavía no existe (la
# tarea siguiente de T8 en tasks/plan.md), y por eso no está en este borrador.
slug: cabeza-de-turco
nombre: Cabeza de turco
familia: Decorativos
abok: 1303

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Un anillo tejido con una sola cuerda para sujetar la pañoleta: pasas las dos puntas por
  dentro y lo subes hasta donde quieras. También sirve de adorno o para forrar un mango.
materiales: >-
  Un cordón de 3 a 4 mm de grosor y alrededor de 1 m de largo.
verificacion:
  - Todo el nudo va doble, con las dos cuerdas juntas y sin cruzarse entre ellas.
  - Si recorres cualquier cuerda, pasa una vez por encima y la siguiente por debajo, siempre alternando.
  - Tiene cuatro senos por fuera y cuatro por dentro, parecidos entre sí.
precauciones:
  - Si queda flojo, se corre solo. Ajústalo otra vez siguiendo la cuerda.
  - Si sellas las puntas con fuego, ten cuidado. El nylon derretido quema.
alternativas:
  - nudo: Puño de mono
    cuando: Cuando quieres una bola tejida en el extremo de una cuerda, como adorno o como peso.

# Gabriel aprobó el borrador de los pasos 1 a 5 el 23 nov de 2026.
estado: cuerda-ok

