  # Paso 1: el resto de cada cuerda, estirado junto a la otra y doblado hacia afuera.
  # La vuelta: el giro pasa por debajo de la otra cuerda, rodea las dos y vuelve por encima
  # de las dos (la rama que vuelve). En el paso de la vuelta, el chicote queda suelto (cae).
