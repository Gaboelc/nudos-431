pasos:
  - titulo: Prepara la cuerda
    texto: >-
      Apoya la cuerda a lo largo del palo, por delante. El tramo largo es el firme; el
      extremo que vas a mover es el chicote. Deja un chicote de unos 60 cm.
    trazado: [firme, punta-1]
    secuencia: ""

  - titulo: Rodea el palo
    texto: >-
      Baja el chicote por delante del palo, pásalo por debajo y súbelo por detrás. Tráelo
      por encima del palo hacia el firme.
    trazado: [firme, vuelta]
    secuencia: ""
    resaltar: {desde: "vuelta[0]", hasta: fin}

  - titulo: Rodea el firme
    texto: >-
      Pasa el chicote por debajo del firme, donde dobla para rodear el palo. Después súbelo
      por encima del firme, a la izquierda.
    trazado: [firme, vuelta, medio-cote, punta-3]
    secuencia: "2U 1O 1U 2O"
    resaltar: {desde: "medio-cote[0]", hasta: fin}

  - titulo: Da la primera vuelta
    texto: >-
      Pasa el chicote por debajo de su propio tramo, el que cruza el palo por arriba, de
      izquierda a derecha.
    trazado: [firme, vuelta, medio-cote, primera, punta-4]
    secuencia: "2U 1O 3O 1U 2O 3U"
    resaltar: {desde: "primera[0]", hasta: fin}

  - titulo: Da dos vueltas más
    texto: >-
      Pasa el chicote por encima de ese tramo y otra vez por debajo, dos veces, avanzando
      hacia atrás. Las tres vueltas quedan juntas sobre el palo. Tira del firme para apretar.
    trazado: [firme, vuelta, medio-cote, primera, vueltas]
    secuencia: "2U 1O 7O 6U 5O 4U 3O 1U 2O 3U 4O 5U 6O 7U"
    resaltar: {desde: "vueltas[0]", hasta: fin}

# El error: la fuente no trae uno. El chicote pasa por encima del firme también la primera
# vez, así que no lo rodea.
error:
  paso: 3
  invierte: [1]
  titulo: El chicote no rodea el firme
  texto: >-
    Pasaste el chicote por encima del firme las dos veces. Así no lo abraza y, al tirar, la
    vuelta se abre. Pásalo primero por debajo del firme y después por encima.
  otros:
    - titulo: Pocas vueltas
      texto: >-
        Con una o dos vueltas, el chicote se puede salir al tirar. Da por lo menos tres, y
        más si el palo es grueso o la cuerda resbalosa.
  encuadre:
    x: [-6.5, 3.5]
    y: [-7.5, -1.0]

terminado:
  encuadre:
    x: [-6.0, 13.0]
    y: [-7.0, 3.0]

# Estado de producción (ver «Estado» en docs/formato-spec.md).
estado: borrador
