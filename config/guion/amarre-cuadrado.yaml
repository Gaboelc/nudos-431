# El guion hablado del video del amarre cuadrado: lo que dice la voz, más suelto que la ficha.
# Borrador para T22a (27 nov de 2026), que decide si estos textos pasan a la especificación como
# su campo `voz:`. Gabriel pidió que la voz suene natural y enganche: el anuncio del paso varía, y
# las vueltas se cuentan como un tejido en vez de una lista. Cada instrucción dice lo mismo que la
# ficha (specs/amarre-cuadrado.yaml): los «por encima» y «por debajo» no cambian.
apertura: >-
  ¿Quieres armar una mesa, una torre o un portón con palos? Todo empieza aquí: el amarre cuadrado
  une dos palos cruzados para que no se corran ni giren.
pasos:
  - >-
    Cruza un palo sobre el otro. En el de abajo, de tu lado y pegado al de arriba, ata un
    ballestrinque, como en su ficha. El chicote, déjalo cortito.
  - >-
    Paso 2 de 7: la primera vuelta. Ahora trabajas con la parte larga. Rodea el cruce como si
    tejieras: por encima del palo de arriba, por debajo del de abajo… y otra vez lo mismo, hasta
    cerrar la vuelta. Todo por delante del ballestrinque.
  - >-
    Dale dos vueltas más por el mismo camino, hasta tener tres. Arriba, cada vuelta queda un poco
    más lejos del cruce que la anterior; abajo, un poco más cerca. Y en cada una, tira fuerte.
  - >-
    Paso 4. Ahora viene lo que aprieta todo: el ahorcado. Pasa la cuerda entre los palos, por
    debajo del de arriba y por encima del de abajo, abrazando las vueltas. Tira fuerte.
  - >-
    Dos ahorcados más, por el mismo camino, cada uno por fuera del anterior. Con tres bien
    apretados, el cruce ya no se mueve.
  - >-
    Para cerrar, un ballestrinque en el palo de arriba. Junto a los ahorcados, pasa la cuerda por
    debajo, dale la vuelta y crúzala en diagonal sobre sí misma, hacia afuera.
  - >-
    Último paso. Otra vuelta al palo, por fuera de la primera, y mete el chicote por debajo de la
    diagonal, entre las dos vueltas. Tira del chicote… y listo.
cierre: >-
  Ahora pruébalo: empuja un palo. Si no se corre ni gira, tu amarre está bien hecho.
seguridad: >-
  Y antes de subirte a una construcción, revisa cada amarre. Si alguno se mueve, gira o tiene la
  cuerda floja, vuelve a hacerlo.
