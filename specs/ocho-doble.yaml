# Ocho doble. Borrador de la skill nudo-nuevo. Trazado propio: las fotos de referencia solo se
# usaron para leer la topología (qué tramo pasa por encima en cada cruce).
#
# Es la gaza en ocho atada con la cuerda doblada en un seno: el ocho con dos cuerdas que van
# juntas, a un diámetro entre sus ejes. Cada cruce del doble son cuatro cruces de la cuerda:
# los de la vuelta son 1, 2, 3, 4; los del rodeo, 5, 6, 7, 8, y los de la pasada por la vuelta,
# 11, 12, 13, 16 arriba y 9, 10, 14, 15 abajo.
slug: ocho-doble
nombre: Ocho doble
familia: Gazas
abok: 1047

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Forma una gaza fija, que no se corre, atada con la cuerda doblada en un seno. Aguanta
  mucha carga, no se afloja sola y se revisa fácil a la vista. Sirve para enganchar un
  mosquetón, colgar una carga o fijar la cuerda a un punto.
materiales: >-
  Una cuerda de unos 2 m. Para aprender, usa una de 6 a 10 mm de grosor que no sea
  rígida.
verificacion:
  - Todo el nudo va doble. Las dos cuerdas corren juntas, una al lado de la otra, sin cruzarse entre ellas.
  - Se ve un 8 hecho con la cuerda doble, como el ocho pero con dos cuerdas.
  - El firme y el chicote salen juntos por un lado del nudo, y la gaza por el otro.
  - Si tiras de la gaza y del firme a la vez, el nudo no se corre y la gaza no cambia de tamaño.
  - Te sobra chicote, por lo menos el ancho de tu mano.
seguridad: >-
  En escalada y en rescate, este nudo se usa para asegurar a personas. En este libro eso
  es solo conocimiento: en las actividades del grupo no lo uses para sostener, subir ni
  bajar a nadie. Esa práctica se hace únicamente con instructor y equipo certificados.
precauciones:
  - Apriétalo bien antes de cargarlo, tirando por separado del firme, del chicote y de los dos lados de la gaza. Flojo, se deforma.
  - Después de aguantar mucha carga cuesta desatarlo. Para aflojarlo, dobla el nudo hacia un lado y hacia el otro.
  - La gaza no se ajusta. Si te quedó grande o chica, deshaz el nudo y vuelve a empezar.
alternativas:
  - nudo: As de guía
    cuando: >-
      Cuando la gaza tiene que rodear algo, como un poste o un árbol, o cuando la vas a
      desatar después de cargarla.
  - nudo: Mariposa alpina
    cuando: Cuando necesitas la gaza en el medio de la cuerda y no en el extremo.
  - nudo: Ocho
    cuando: Cuando solo necesitas un tope en el extremo de la cuerda, sin gaza.

