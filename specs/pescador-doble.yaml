# Pescador doble: une dos cuerdas del mismo grosor con un nudo de dos vueltas de cada una
# alrededor de la otra. Borrador de la skill nudo-nuevo. Trazado propio: las fotos de
# Animated Knots (entradas/pescador-doble) solo se usaron para leer la topología.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa.
slug: pescador-doble
nombre: Pescador doble
familia: De unión
# Según la fuente; sin confirmar.
abok: 294

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Une dos cuerdas del mismo grosor con más firmeza que el pescador, también si son
  resbalosas. Sirve para cerrar un cordón en anillo y para unir dos cuerdas largas.
materiales: >-
  Dos cuerdas del mismo grosor, de 1,5 m y de colores distintos. Para aprender, de 6 a
  10 mm y que no sean rígidas.
verificacion:
  - Cada cuerda da dos vueltas alrededor de las dos, y su chicote pasa por dentro de ellas.
  - Las dos vueltas de cada nudo van una junto a la otra, sin montarse.
  - Los dos nudos quedan juntos, uno contra el otro.
  - Cada chicote sale hacia afuera, junto al firme de la otra cuerda.
  - A cada chicote le sobra por lo menos el ancho de tu mano.
seguridad: >-
  En escalada y rescate se usa para unir cuerdas que sostienen a una persona; aquí es solo
  conocimiento. En las actividades del grupo no lo uses para sostener, subir ni bajar a
  nadie: esa práctica se hace solo con instructor y equipo certificados.
# Texto propio: los cuidados que ya dice «seguridad» no se repiten aquí.
precauciones:
  - >-
    Apretado, y más si estuvo cargado, a veces no se puede desatar. Si lo vas a desatar,
    usa otro nudo.
  - >-
    Con cuerdas resbalosas o tiesas, revisa que las vueltas sigan en su lugar antes de
    volver a tirar.
alternativas:
  - nudo: Pescador
    cuando: >-
      Cuando las cuerdas no son resbalosas y basta un nudo más chico: cada cuerda da una
      sola vuelta.
  - nudo: Vuelta de escota
    cuando: Cuando las cuerdas son de distinto grosor o la vas a desatar después.

# Estado de producción (ver «Estado» en docs/formato-spec.md).
estado: cuerda-ok

# Los filtros humanos. El filtro 2 está en pausa desde el 9 de noviembre de 2026.
filtros:
  - filtro: 1
    fecha: 2026-11-15
    resultado: aprobado
    ficha: 6005d98

cuerdas:
  - {nombre: azul, grosor: 1, color: azul}
  - {nombre: crema, grosor: 1, color: crema}

encuadre:
  x: [-16.4, 16.4]
  y: [-5.5, 5.5]

# Como en las fotos: la azul llega por la izquierda, del lado tuyo, y la crema por la
# derecha, del lado del fondo. La azul ata primero, a la derecha. Tallado con las medidas
# que funcionaron en el pescador: las cuerdas a 1,3 diámetros, todos los arcos de radio
# 1,8 (con 1,6, el reverso del terminado quedaba encogido más de 2 %), y 3,6 diámetros
# entre dos tramos donde una cuerda se teje entre ellos. Las vueltas no se dibujan
# apretadas alrededor de las cuerdas: cada una cruza las dos cuerdas y se cierra del lado
# del fondo (o del tuyo), sin montarse en las otras, y el chicote pasa por dentro de ellas. El nudo de la crema es el de la azul girado
# media vuelta, con los mismos encima/debajo. El segundo nudo se ata junto al primero, a
# 1,5 diámetros, y el último paso solo dice que se tiren los firmes.
