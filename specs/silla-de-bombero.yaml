pasos:
  - titulo: Prepara la cuerda
    texto: >-
      El nudo va en medio de la cuerda y los dos extremos son firmes. Déjalos hacia ti, uno a
      cada lado, y forma en el medio un seno hacia el fondo.
    trazado: [firme-a, entra-a, seno-1, sale-b, firme-b]
    secuencia: ""

  - titulo: Haz un lazo
    texto: >-
      Cruza los dos lados del seno: el de la izquierda pasa por encima del de la derecha.
      Queda un lazo.
    trazado: [firme-a, entra-a, f-sube, bulto-l, arco-l, lado-l, fondo-2, sale-b, firme-b]
    secuencia: "1O 1U"
    resaltar: {desde: "f-sube[0]", hasta: "lado-l[-1]"}

  - titulo: Pon otro lazo encima
    texto: >-
      A la derecha, haz otro lazo igual: el tramo que viene del primero pasa por encima.
      Ponlo encima del primero, montado hasta la mitad.
    trazado: [firme-a, entra-a, f-sube, bulto-l, arco-l, lado-l, fondo, lado-r, arco-r, bulto-r, baja-r, sale-b, firme-b]
    secuencia: "1O 3U 4U 1U 2O 4O 3O 2U"
    resaltar: {desde: "fondo[0]", hasta: "baja-r[-1]"}

  - titulo: Saca las gazas
    texto: >-
      Saca el lado izquierdo del lazo de encima hacia la izquierda, por debajo del borde del
      otro. Saca el lado derecho del de abajo hacia la derecha, por encima del borde del de
      encima. Son las gazas: ajusta su tamaño.
    trazado: [firme-a, entra-a, f-sube, pata-ab-d, gaza-d, pata-ar-d, arco-l, lado-l, fondo, lado-r, arco-r, pata-ar-i, gaza-i, pata-ab-i, baja-r, sale-b, firme-b]
    secuencia: "1O 3U 7O 8O 4U 5O 6O 1U 2O 7U 8U 4O 5U 6U 3O 2U"
    resaltar: {desde: "pata-ab-d[0]", hasta: "pata-ab-i[-1]"}

  - titulo: Haz un lazo con el firme
    texto: >-
      Junto al nudo, debajo de la gaza de la izquierda, haz un lazo con el firme de la
      izquierda: el tramo que va hacia ti pasa por encima.
    trazado: [firme-a, sube-5, lazo-5, cierra-5, f-sube, pata-ab-d, gaza-d, pata-ar-d, arco-l, lado-l, fondo, lado-r, arco-r, pata-ar-i, gaza-i, pata-ab-i, baja-r, sale-b, firme-b]
    secuencia: "9O 9U 1O 3U 7O 8O 4U 5O 6O 1U 2O 7U 8U 4O 5U 6U 3O 2U"
    resaltar: {desde: "sube-5[0]", hasta: "cierra-5[-1]"}

  - titulo: Traba la gaza de la izquierda
    texto: >-
      Pasa la gaza por el lazo: el tramo que va hacia ti queda debajo de sus dos patas y el
      otro lado del lazo, encima. Ciérralo junto al nudo tirando del firme.
    trazado: [firme-a, sube-6, cote-6, cierra-6, f-sube, pata-ab-d, gaza-d, pata-ar-d, arco-l, lado-l, fondo, lado-r, arco-r, pata-ar-i, gaza-i, pata-ab-i, baja-r, sale-b, firme-b]
    secuencia: "9O 10U 11U 12O 13O 9U 1O 3U 7O 8O 4U 5O 6O 1U 2O 7U 8U 4O 5U 11O 12U 13U 10O 6U 3O 2U"
    resaltar: {desde: "sube-6[0]", hasta: "cierra-6[-1]"}

  - titulo: Traba la gaza de la derecha
    texto: >-
      Haz lo mismo con el firme de la derecha, al revés: en su lazo, el tramo que va hacia ti
      pasa por debajo, y en la gaza, por encima de las dos patas. Cierra el cote junto al nudo.
    trazado: [firme-a, sube-6, cote-6, cierra-6, f-sube, pata-ab-d, gaza-d, pata-ar-d, arco-l, lado-l, fondo, lado-r, arco-r, pata-ar-i, gaza-i, pata-ab-i, baja-r, cierra-6d, cote-6d, sube-6d, firme-b]
