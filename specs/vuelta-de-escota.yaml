# Vuelta de escota: une dos cuerdas, aquí de distinto grosor. Es el primer nudo de dos
# cuerdas. Trazado propio: las fotos de referencia solo se usaron para leer la topología.
# Unidades: diámetros de la cuerda de siempre. x a la derecha, y hacia el fondo de la mesa.
slug: vuelta-de-escota
nombre: Vuelta de escota
otros_nombres: [vuelta de escota simple]
familia: De unión
abok: 1431

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
# Pendiente: que Gabriel lo revise.
usos: >-
  Une dos cuerdas, sobre todo si una es más gruesa que la otra, por ejemplo para alargar
  una con la otra. También sirve si son del mismo grosor.
materiales: >-
  Dos cuerdas de 1 m más o menos, una más gruesa que la otra; por ejemplo, una de 10 mm
  y otra de 6 mm. Para aprender, que no sean rígidas.
verificacion:
  - El seno lo forma la gruesa, y la delgada lo rodea.
  - Los dos chicotes salen del mismo lado del nudo.
  - El chicote de la delgada queda apretado entre el seno y el tramo de la delgada que sale de él.
  - Al tirar de los dos firmes, el nudo se aprieta y no se desliza.
  - A cada chicote le sobra por lo menos el largo de tu mano.
precauciones:
  - Si las cuerdas quedan sueltas o se sacuden, se puede aflojar. Revísala antes de volver
    a tirar.
  - Si los chicotes quedan en lados opuestos del nudo, aguanta menos. Deshazla y átala otra
    vez.
  - >-
    No sirve para atar apretado alrededor de algo: se hace con las dos cuerdas sueltas en
    la mano, sin carga.
alternativas:
  - nudo: Vuelta de escota doble
    cuando: >-
      Cuando una cuerda es mucho más gruesa que la otra o las dos son resbalosas: la delgada
      da una vuelta más alrededor del seno.
  - nudo: Pescador
    cuando: Para unir dos cuerdas delgadas del mismo grosor, como dos sedales.
  - nudo: Rizo
    cuando: Para atar apretado alrededor de algo, como un paquete o una venda.

# Estado de producción (ver «Estado» en docs/formato-spec.md).
estado: cuerda-ok

# Los filtros humanos. El filtro 2 está en pausa desde el 9 de noviembre de 2026.
filtros:
  - filtro: 1
    fecha: 2026-11-09
    resultado: aprobado
    ficha: 9ec2271

cuerdas:
  - {nombre: gruesa, grosor: 1.5, color: azul}
  - {nombre: delgada, grosor: 1, color: crema}

encuadre:
  x: [-9.0, 10.5]
  y: [-5.5, 9.5]

# Donde la delgada pasa por debajo de la gruesa, la cruza en diagonal: si la cruzara en
# ángulo recto, la gruesa se doblaría sobre ella con un radio menor que su diámetro.
segmentos:
  # La gruesa: el firme llega desde la izquierda, da la vuelta en el seno y su chicote
  # vuelve hacia la izquierda, más al fondo. El seno es media vuelta de radio 2,4.
  gruesa-firme: [[-30.0, 0.0], [-22.0, 0.0], [-15.0, 0.0], [-10.0, 0.0], [-6.0, 0.0],
                 [-2.0, 0.0], [1.5, 0.0], [3.1, 0.0]]
  seno: [[4.5, 0.0], [5.7, 0.32], [6.58, 1.2], [6.9, 2.4], [6.58, 3.6], [5.7, 4.48],
         [4.5, 4.8]]
  gruesa-chicote: [[3.1, 4.8], [1.5, 4.8], [-1.5, 4.8], [-4.5, 4.8], [-7.0, 4.8]]
  # La delgada sube desde abajo, a la derecha, hacia la punta del seno.
  delgada-firme: [[15.5, -23.2], [12.0, -13.8], [10.0, -8.2], [8.6, -4.4], [7.9, -2.4]]
  # Entra en diagonal por debajo de la punta del seno y sale por encima del chicote de la gruesa.
  entra: [[6.58, 1.2], [6.2, 2.25], [5.45, 3.1]]
  cruza: [[4.35, 3.85], [3.0, 4.8]]
  sale: [[2.75, 5.8], [2.5, 7.0], [2.4, 8.4]]
  # Rodea por debajo las dos ramas del seno, primero el chicote de la gruesa y luego su
  # firme, en diagonal, y vuelve hacia la derecha por debajo del nudo.
  rodea: [[2.75, 5.8], [2.2, 6.8], [1.2, 7.5], [-0.1, 7.7], [-1.2, 7.2], [-1.9, 6.3],
          [-2.8, 4.8], [-4.2, 2.4], [-5.57, 0.0], [-6.3, -1.3], [-6.2, -2.8], [-5.3, -3.6],
          [-4.2, -3.45]]
  rodea-fin: [[-3.5, -2.7]]
  # Cruza el seno en diagonal por encima de sus dos ramas y pasa por debajo de sí misma,
  # del tramo que salió del seno. Volteado, la gruesa queda encima: también en diagonal.
  mete: [[-3.55, -2.65], [-3.0, -1.5], [-2.0, 0.0], [-1.15, 1.2], [-0.3, 2.4], [0.55, 3.6],
         [1.4, 4.8], [1.95, 5.6], [2.5, 6.4], [3.0, 7.2], [3.5, 8.0]]

pasos:
  - titulo: Haz un seno en la gruesa
    texto: >-
      Dobla el extremo de la gruesa en U, con el chicote junto al firme. Esa U es el
      seno. Desde aquí solo mueves la delgada.
    trazado:
      gruesa: [gruesa-firme, seno, gruesa-chicote]
      delgada: [delgada-firme]
    secuencia:
      gruesa: ""
      delgada: ""
    resaltar: {desde: "seno[0]", hasta: fin}

  - titulo: Pasa la delgada por el seno
    texto: >-
      Lleva el chicote de la delgada a la punta del seno: pásalo por debajo y sácalo por
      dentro, por encima del chicote de la gruesa.
    trazado:
      gruesa: [gruesa-firme, seno, gruesa-chicote]
      delgada: [delgada-firme, entra, cruza, sale]
    secuencia:
      gruesa: "1O 2U"
      delgada: "1U 2O"
    resaltar: {desde: "entra[0]", hasta: fin}

  - titulo: Rodea el seno por debajo
    texto: >-
      Pásalo por debajo de las dos ramas del seno: primero la del chicote de la gruesa y
      luego la del firme. Con la cuerda en la mano, es pasar por detrás.
    trazado:
      gruesa: [gruesa-firme, seno, gruesa-chicote]
      delgada: [delgada-firme, entra, cruza, rodea, rodea-fin]
    secuencia:
      gruesa: "4O 1O 2U 3O"
      delgada: "1U 2O 3U 4U"
    resaltar: {desde: "rodea[0]", hasta: fin}

  - titulo: Métela por debajo de sí misma
    texto: >-
      Cruza el chicote por encima del seno y mételo por debajo del tramo de la delgada que
      salió del seno. Sujeta los chicotes y tira de los firmes.
    trazado:
      gruesa: [gruesa-firme, seno, gruesa-chicote]
      delgada: [delgada-firme, entra, cruza, rodea, mete]
    secuencia:
      gruesa: "4O 5U 1O 2U 7U 3O"
      delgada: "1U 2O 6O 3U 4U 5O 7O 6U"
    # Empieza al final de la vuelta: el tramo que salió del seno queda crema y el chicote,
    # resaltado, pasa por debajo de él. Es lo que compara la imagen del error.
    resaltar: {desde: "rodea[-1]", hasta: fin}

# El error más común: el chicote pasa por encima de sí misma y no queda trabado.
error:
  paso: 4
  invierte: [6]
  titulo: El chicote por encima de la delgada
  texto: >-
    Pasaste el chicote por encima del tramo de la delgada que salió del seno. Así no queda
    trabado y el nudo se suelta al tirar. Sácalo y vuelve a pasarlo por debajo de ese tramo.
  encuadre:
    x: [-3.0, 7.5]
    y: [-3.0, 8.5]

terminado:
  encuadre:
    x: [-7.0, 8.5]
    y: [-4.0, 8.5]
