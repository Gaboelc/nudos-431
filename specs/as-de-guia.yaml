# As de guía. Trazado propio: las fotos de referencia solo se usaron para leer
# la topología (qué tramo pasa por encima en cada cruce).
slug: as-de-guia
nombre: As de guía
familia: Gazas
abok: 1010

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Forma una gaza fija en el extremo de la cuerda: no se cierra ni se corre cuando
  tiras del firme. Sirve para rodear un poste o un árbol, pasar la cuerda por una
  argolla o colgar algo de una rama. Aunque haya aguantado mucha carga, se desata
  con facilidad.
materiales: >-
  Una cuerda de unos 2 m. Para aprender, usa una de 6 a 10 mm de grosor que no sea
  rígida.
verificacion:
  - La gaza grande quedó del tamaño que calculaste y no se cierra cuando tiras del firme.
  - Por delante, el chicote baja por la gaza pequeña junto al tramo que subió.
  - Por detrás, el chicote rodea al firme como un collar.
  - El chicote termina dentro de la gaza grande, no afuera.
  - Te sobra chicote, por lo menos el largo de tu mano.
seguridad: >-
  En rescate, este nudo se usa para hacer una gaza alrededor del pecho de una
  persona. En este libro eso es solo conocimiento: en las actividades del grupo no
  lo uses para sostener, subir ni bajar a nadie. Esa práctica se hace únicamente con
  instructor y equipo certificados, y en una emergencia real primero llamas al
  9-1-1. Además, si la cuerda queda sin carga o es rígida o resbalosa, el nudo se
  puede aflojar: revísalo cada vez antes de usarlo.

encuadre:
  x: [-11.4, 9.4]
  y: [-15.6, 12.4]

segmentos:
  # El firme baja desde el fondo de la mesa.
  firme: [[0.0, 30.0], [0.0, 22.0], [0.03, 15.0], [0.08, 11.5], [0.12, 9.6],
          [0.18, 7.6], [0.22, 5.8], [0.27, 4.1], [0.35, 2.6]]
  # El mismo firme, antes de formar la gaza pequeña.
  firme-sin-gaza: [[0.0, 30.0], [0.0, 22.0], [0.03, 15.0], [0.08, 11.5], [0.12, 9.6],
                   [0.18, 7.6], [0.35, 5.4], [1.0, 3.3], [2.1, 1.2]]
  # Gaza pequeña: sale del cruce 1, da la vuelta y vuelve a él.
  gaza-pequena: [[0.15, 1.2], [-0.5, 0.05], [-1.6, -0.5], [-2.8, -0.6], [-3.9, -0.2],
                 [-4.6, 0.8], [-4.8, 2.1], [-4.3, 3.5], [-3.3, 4.35], [-2.1, 4.55],
                 [-0.9, 4.0], [0.35, 2.6]]
  # Gaza final: grande mientras se ata (pasos 1 a 3) y de su tamaño final después.
  gaza-grande: [[1.4, 1.5], [3.2, -0.6], [4.9, -3.3], [6.0, -6.5], [6.0, -9.6],
                [4.6, -12.2], [1.8, -13.6], [-1.8, -13.7], [-5.0, -12.6],
                [-7.2, -10.2], [-8.0, -7.2]]
  gaza: [[1.4, 1.5], [3.0, -0.6], [4.3, -3.3], [5.0, -6.2], [4.8, -8.9],
         [3.5, -11.0], [1.0, -12.1], [-2.0, -12.1], [-4.5, -11.0],
         [-5.9, -8.8], [-6.1, -6.3], [-5.4, -4.0]]
  # El chicote en cada momento.
  chicote-libre: [[-8.1, -4.2], [-7.9, -1.2], [-7.5, 1.4], [-7.0, 3.2]]
  chicote-acerca: [[-7.7, -4.6], [-6.6, -3.2], [-5.1, -2.5], [-3.9, -1.9]]
  chicote-sube: [[-4.3, -2.4], [-3.35, -1.2], [-3.0, 0.3], [-2.95, 2.4]]
  chicote-sale: [[-3.0, 5.6], [-3.3, 7.0]]
  rodeo-detras: [[-3.0, 5.8], [-2.8, 7.4], [-2.1, 8.75], [-1.0, 9.55], [1.3, 9.62]]
  rodeo-detras-fin: [[2.6, 9.4], [3.7, 9.15]]
  rodeo-delante: [[2.5, 8.95], [3.0, 7.85], [2.7, 6.75], [1.8, 6.1], [0.8, 5.8],
                  [-0.5, 5.45], [-1.3, 4.95], [-1.7, 3.95]]
  rodeo-delante-fin: [[-1.75, 3.1]]
  chicote-baja: [[-1.75, 2.0], [-1.72, 0.6], [-1.66, -1.6], [-1.6, -3.0], [-1.55, -4.0]]

pasos:
  - titulo: Calcula la gaza
    texto: >-
      Decide el tamaño de la gaza final y deja chicote de sobra. El tramo que sube
      es el firme; el extremo libre es el chicote.
    trazado: [firme-sin-gaza, "gaza-grande[1:]", chicote-libre]
    secuencia: ""

  - titulo: Haz una gaza pequeña
    texto: >-
      Forma un ojo en el firme con el tramo que va hacia el chicote por encima.
      Revisa este cruce: al revés no sale un as de guía.
    trazado: [firme, gaza-pequena, gaza-grande, chicote-libre]
    secuencia: "1U 1O"
    # Empieza después del cruce: así el firme llega azul y el tramo que va al chicote,
    # resaltado, pasa por encima. Es lo que compara la imagen del error.
    resaltar: {desde: "gaza-pequena[0]", hasta: "gaza-grande[0]"}

  - titulo: Acerca el chicote
    texto: Llévalo hacia la gaza pequeña desde el lado de la gaza grande.
    trazado: [firme, gaza-pequena, gaza-grande, chicote-acerca]
    secuencia: "1U 1O"
    resaltar: {desde: "gaza-grande[-2]", hasta: fin}

  - titulo: Sube por la gaza
    texto: "Pasa el chicote por la gaza pequeña: entra por debajo y sale por encima."
    trazado: [firme, gaza-pequena, gaza, chicote-sube, chicote-sale]
    secuencia: "1U 2O 3U 1O 2U 3O"
    resaltar: {desde: "chicote-sube[0]", hasta: fin}

  - titulo: Pasa por debajo del firme
    texto: Rodea el firme por debajo. Con la cuerda en la mano, esto es pasar por detrás.
    trazado: [firme, gaza-pequena, gaza, chicote-sube, rodeo-detras, rodeo-detras-fin]
    secuencia: "4O 1U 2O 3U 1O 2U 3O 4U"
    resaltar: {desde: "rodeo-detras[0]", hasta: fin}

  - titulo: Vuelve por encima
    texto: >-
      Cruza el firme otra vez, ahora por encima, y lleva el chicote a la gaza
      pequeña.
    trazado: [firme, gaza-pequena, gaza, chicote-sube, rodeo-detras, rodeo-delante,
              rodeo-delante-fin]
    secuencia: "4O 5U 1U 2O 3U 6U 1O 2U 3O 4U 5O 6O"
    resaltar: {desde: "rodeo-detras[-1]", hasta: fin}

  - titulo: Baja y ajusta
    texto: >-
      Baja el chicote por la gaza pequeña, junto al tramo que subió. Sujeta chicote
      y gaza juntos y tira del firme. El chicote queda dentro de la gaza.
    trazado: [firme, gaza-pequena, gaza, chicote-sube, rodeo-detras, rodeo-delante,
              chicote-baja]
    secuencia: "4O 5U 1U 7O 2O 3U 6U 1O 2U 3O 4U 5O 6O 7U"
    resaltar: {desde: "rodeo-delante[-3]", hasta: fin}

# El error más común: la gaza pequeña al revés. Es el paso 2 con el cruce 1 invertido.
error:
  paso: 2
  invierte: [1]
  titulo: La gaza pequeña al revés
  texto: >-
    El tramo que va hacia el chicote quedó por debajo del firme. Si sigues así, no
    sale un as de guía. Deshaz la gaza y vuelve a formarla con ese tramo por encima.
  encuadre:
    x: [-6.5, 3.5]
    y: [-2.5, 7.0]

# El nudo terminado se muestra por delante y por detrás, sin el resto de la gaza final.
terminado:
  encuadre:
    x: [-6.5, 5.5]
    y: [-5.0, 11.5]
