# Tensor ajustable sobre una estaca. Borrador de la skill nudo-nuevo, para que Gabriel lo revise.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa, z hacia arriba.
# La estaca es un cilindro parado en x = y = 0. El firme llega por la derecha, del lado de la
# carpa, y el nudo se hace sobre él, a la derecha de la estaca. Las vueltas del chicote al
# firme son semicírculos de radio 1,75 que lo cruzan cada 3,5 diámetros, y el firme se ondula
# 0,5 al revés que el chicote, como dos cuerdas torcidas (como en el nudo aguja).
slug: tensor-ajustable
nombre: Tensor ajustable
familia: De sujeción
estado: borrador

usos: >-
  Tensa una cuerda atada a una estaca, como el viento de una carpa o de un toldo, o una cuerda
  para colgar ropa. El nudo se corre por la cuerda para tensarla o aflojarla, y cuando la
  cuerda tira se traba y no se mueve.
materiales: >-
  Una cuerda de 2 a 3 m y una estaca clavada. Para practicar, ata el otro extremo a algo fijo
  y usa como estaca la pata de una silla.
verificacion:
  - Dentro de la gaza, el chicote da dos vueltas al firme, una junto a la otra.
  - Por fuera de esas vueltas, más lejos de la estaca, da una vuelta más y sale apretado entre el firme y el tramo que sube a él.
  - Con la cuerda floja, el nudo se corre por el firme; con la cuerda tensa, se traba.
precauciones:
  - >-
    Con una cuerda lisa o resbalosa, como el nailon delgado, puede correrse. Antes de dejarlo,
    tira fuerte de la cuerda y mira que no se mueva.
  - "Revisa la tensión después de la lluvia y por la mañana: la cuerda cambia de largo al mojarse y al secarse."
alternativas:
  - nudo: Tensor
    cuando: Cuando necesitas tensar mucho la cuerda, como para sujetar una carga, y no solo ajustarla.
  - nudo: Media llave y dos cotes
    cuando: Cuando la cuerda solo tiene que quedar atada a la estaca y no hace falta ajustarla.

anfitrion: {tipo: estaca, radio: 1.5, alto: 5}

