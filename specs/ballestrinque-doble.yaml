# Ballestrinque doble sobre un poste, hecho con el chicote: la versión de Ashley para un palo
# (ABOK 1734), con las dos primeras vueltas una junto a la otra. Es un ballestrinque con la
# primera vuelta doble, y el firme tira a lo largo del poste, hacia el lado de esas vueltas.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa, z hacia arriba.
# El poste va a lo largo de x, con el eje en y = 0. Sobre el poste, los puntos son
# [x, ángulo]: 0° arriba, 90° hacia quien ata, 180° abajo y 270° atrás.
slug: ballestrinque-doble
nombre: Ballestrinque doble
familia: De sujeción
abok: 1734

usos: >-
  Sujeta una cuerda a un palo, un tronco o un mástil cuando la carga tira a lo largo de él y
  no hacia un costado: en esa dirección no se corre. Sirve, por ejemplo, para arrastrar un
  tronco tirando de una punta o para que una cuerda no resbale por un poste parado cuando
  cuelgas algo de ella. También se ata sobre otra cuerda tensa.
materiales: >-
  Una cuerda de 1 a 2 m y un palo redondo, como el de una escoba.
verificacion:
  - Las dos primeras vueltas van juntas, del lado hacia donde tira el firme, y las dos pasan
    por encima del firme.
  - La diagonal cruza por encima de esas dos vueltas, hacia el otro lado.
  - La última vuelta queda del otro lado, y el chicote sale por debajo de la diagonal.
  - Al tirar del firme a lo largo del poste, las vueltas aprietan y el nudo no se corre.
# Texto propio. Pendiente: que Gabriel lo revise.
precauciones:
  - Solo aguanta si tiras a lo largo del poste, hacia el lado de las dos vueltas. Si tiras
    hacia un costado o hacia el otro lado, se corre.
  - En un palo liso o mojado, o con una cuerda resbalosa, como las de polipropileno, puede
    deslizarse aunque esté bien hecho. Pruébalo primero con poca carga.
  - Antes de cargarlo, aprieta bien las vueltas. Si quedan flojas, el nudo resbala hasta
    que se aprietan.
alternativas:
  - nudo: Ballestrinque
    cuando: Cuando la carga tira hacia un costado del poste y no a lo largo; se hace más rápido.
  - nudo: Prusik
    cuando: >-
      Cuando quieres sujetar un cordino cerrado a otra cuerda y que agarre hacia los dos
      lados.

anfitrion:
  tipo: poste
  radio: 1.5
  desde: -14
  hasta: 14

# Zona que se muestra en todos los pasos.
encuadre:
  x: [-6.5, 5.5]
  y: [-7.0, 7.5]

segmentos:
  # El firme va por encima del poste y tira hacia la derecha, a lo largo de él.
  firme:
    poste: [[13, -36], [9, -36], [5.5, -36], [3.3, -37]]
  # En el paso 1 la cuerda sigue derecha a lo largo del poste.
  punta-1:
    poste: [[0.5, -36], [-2.5, -36]]
  # Al llegar al nudo, el firme se va hacia delante en diagonal, por debajo de las vueltas.
  entrada:
    poste: [[2.4, -36], [1.6, -21], [0.9, -4], [0.35, 14]]
  # Primera vuelta: baja por delante del poste, pasa por debajo y por detrás, y vuelve por
  # encima a la derecha, por encima del firme.
  vuelta-1:
    poste: [[-0.05, 45], [-0.3, 70], [-0.4, 100], [-0.69, 115], [-0.68, 130], [-0.3, 145],
            [0.22, 160], [0.52, 175], [0.45, 190], [0.14, 205], [-0.04, 220], [0.12, 235],
            [0.58, 250], [1.05, 265], [1.2, 280], [0.99, 295], [0.92, 310], [1, 325],
            [1.1, 345]]
  # Segunda vuelta, a la derecha de la primera; también pasa por encima del firme.
  vuelta-2:
    poste: [[1.25, 385], [1.36, 410], [1.48, 435], [1.58, 460], [1.27, 475], [1.26, 490],
            [1.6, 505], [2.06, 520], [2.31, 535], [2.18, 550], [1.83, 565], [1.6, 580],
            [1.72, 595], [2.15, 610], [2.59, 625], [2.73, 640], [2.54, 655], [2.49, 670],
            [2.62, 690]]
  # En el paso 3 el chicote queda por delante, hacia abajo.
  punta-3:
    poste: [[2.82, 725], [3.0, 750], [3.1, 775]]
  # Diagonal: baja por delante y cruza hacia la izquierda, por encima de las dos vueltas.
  diagonal:
    poste: [[2.75, 720], [2.72, 745], [2.55, 770], [2.3, 788], [1.9, 802], [1.3, 812],
            [0.5, 818], [-0.4, 822], [-1.3, 826], [-2.2, 832], [-2.9, 841], [-3.35, 855]]
  # Tercera vuelta, a la izquierda de todo.
  vuelta-3:
    poste: [[-3.6, 880], [-3.72, 920], [-3.8, 960], [-3.86, 1000]]
  # En el paso 4 el chicote sale por debajo del poste, hacia atrás.
  atras-4: [[-3.8, 2.7], [-4.0, 4.9]]
  # El chicote baja por delante, pasa por debajo de la diagonal y sale por debajo del poste.
  metido:
    poste: [[-3.9, 1040], [-3.92, 1070], [-3.6, 1100], [-3.0, 1128], [-2.35, 1152],
            [-1.95, 1175], [-1.8, 1200], [-1.75, 1230], [-1.7, 1260]]
  atras-6: [[-1.65, 2.7], [-1.5, 4.9]]

pasos:
  - titulo: Prepara la cuerda
    texto: >-
      Apoya la cuerda a lo largo del poste, por encima. El firme va hacia la derecha, que es
      hacia donde va a tirar la carga. Deja hacia la izquierda un chicote de unos 50 cm.
    trazado: [firme, punta-1]
    secuencia: ""

  - titulo: Da la primera vuelta
    texto: >-
      Baja el chicote por delante del poste, pásalo por debajo y súbelo por detrás. Tráelo
      por encima, a la derecha de donde empezó la vuelta, cruzando por encima del firme.
    trazado: [firme, entrada, vuelta-1, "vuelta-2[0:3]"]
    secuencia: "1U 1O"
    resaltar: {desde: "vuelta-1[0]", hasta: fin}

  - titulo: Da la segunda vuelta
    texto: >-
      Da otra vuelta igual, pegada a la primera por la derecha: por delante, por debajo, por
      detrás y otra vez por encima del firme.
    trazado: [firme, entrada, vuelta-1, vuelta-2, punta-3]
    secuencia: "2U 1U 1O 2O"
    resaltar: {desde: "vuelta-2[2]", hasta: fin}

  - titulo: Cruza sobre las vueltas
    texto: >-
      Baja el chicote en diagonal hacia la izquierda, por delante y por encima de las dos
      vueltas. Pásalo por debajo del poste, a la izquierda de donde empezaste.
    trazado: [firme, entrada, vuelta-1, vuelta-2, diagonal, "vuelta-3[0:2]", atras-4]
    secuencia: "2U 1U 4U 1O 3U 2O 3O 4O"
    resaltar: {desde: "diagonal[0]", hasta: fin}

  - titulo: Da la tercera vuelta
    texto: >-
      Sube el chicote por detrás y pásalo por encima del poste, hacia ti.
    trazado: [firme, entrada, vuelta-1, vuelta-2, diagonal, vuelta-3, "metido[0:3]"]
    secuencia: "2U 1U 4U 1O 3U 2O 3O 4O"
    resaltar: {desde: "vuelta-3[0]", hasta: fin}

  - titulo: Mételo bajo la diagonal
    texto: >-
      Baja el chicote por delante y mételo por debajo de la diagonal, entre la última vuelta
      y las otras dos. Pásalo por debajo del poste y tira del firme y del chicote para ajustar.
    trazado: [firme, entrada, vuelta-1, vuelta-2, diagonal, vuelta-3, metido, atras-6]
    secuencia: "2U 1U 4U 1O 3U 2O 3O 4O 5O 5U"
    resaltar: {desde: "metido[0]", hasta: fin}

# Error elegido en el borrador (la fuente no dice cuál es el más común): la segunda vuelta
# pasa por debajo del firme, así que no lo aprieta contra el poste.
error:
  paso: 3
  invierte: [2]
  titulo: La segunda vuelta por debajo del firme
  texto: >-
    Pasaste la segunda vuelta por debajo del firme. Así no lo aprieta contra el poste, y el
    nudo se corre al tirar. Deshaz esa vuelta y vuelve a darla por encima del firme.
  encuadre:
    x: [-1.5, 5.0]
    y: [-4.5, 3.5]
  otros:
    - titulo: Las vueltas del lado equivocado
      texto: >-
        Si das las dos primeras vueltas hacia el lado contrario al que tira el firme, el nudo
        se corre apenas lo cargas. Fíjate antes hacia dónde va a tirar la carga y da las
        vueltas hacia ese lado.

terminado:
  encuadre:
    x: [-6.0, 5.0]
    y: [-6.0, 6.0]

# Estado de producción (ver «Estado» en docs/formato-spec.md).
estado: borrador
