pasos:
  - titulo: Prepara las cuerdas
    texto: >-
      Pon las cuerdas lado a lado: la azul llega por la izquierda y la crema por la derecha.
      Deja unos 40 cm de cada chicote junto a la otra cuerda.
    trazado:
      azul: [azul-firme, azul-recto, azul-u]
      crema: [crema-firme, crema-recto, crema-u]
    secuencia:
      azul: ""
      crema: ""

  - titulo: Da una vuelta con la azul
    texto: >-
      Lleva el chicote de la azul hacia el fondo por encima de la crema. Rodea las dos
      cuerdas y vuelve hacia ti por debajo de las dos.
    trazado:
      azul: [azul-firme, azul-vuelta1, azul-cae1]
      crema: [crema-firme, crema-recto, crema-u]
    secuencia:
      azul: "3O 1O 2U 3U"
      crema: "1U 2O"
    resaltar: {desde: "azul-vuelta1[0]", hasta: fin}

  - titulo: Da la segunda vuelta
    texto: >-
      Da otra vuelta igual alrededor de las dos cuerdas, junto a la primera y más cerca del
      firme de la azul.
    trazado:
      azul: [azul-firme, azul-vuelta1, azul-vuelta2, azul-cae2]
      crema: [crema-firme, crema-recto, crema-u]
    secuencia:
      azul: "7O 4U 3O 1O 2U 3U 4O 5O 6U 7U"
      crema: "1U 2O 5U 6O"
    resaltar: {desde: "azul-vuelta2[0]", hasta: fin}

  - titulo: Mete el chicote de la azul
    texto: >-
      Mételo por dentro de las dos vueltas: por encima de las dos cuerdas y por debajo de
      las vueltas. Sácalo hacia la derecha y tira de él para cerrar el nudo.
    trazado:
      azul: [azul-firme, azul-vuelta1, azul-vuelta2, azul-mete]
      crema: [crema-firme, crema-recto, crema-u]
    secuencia:
      azul: "7O 8U 4U 3O 1O 12O 11U 2U 3U 4O 5O 10O 6U 7U 8O 9O 10U 11O 12U"
      crema: "1U 2O 5U 9U 6O"
    # Empieza después del cruce 7: en los cruces 8 y 9, la azul y la crema llegan sin
    # resaltar y el chicote pasa por encima. Es lo que compara la imagen del error.
    resaltar: {desde: "azul-mete[0]", hasta: fin}

  - titulo: Da dos vueltas con la crema
    texto: >-
      Haz lo mismo del otro lado: lleva el chicote de la crema hacia ti por encima de la
      azul y da dos vueltas alrededor de las dos cuerdas, la segunda más cerca del firme de
      la crema.
    trazado:
      azul: [azul-firme, azul-vuelta1, azul-vuelta2, azul-mete]
      crema: [crema-firme, crema-vuelta1, crema-vuelta2, crema-cae2]
    secuencia:
      azul: "13U 14O 17U 18O 7O 8U 4U 3O 1O 12O 11U 2U 3U 4O 5O 10O 6U 7U 8O 9O 10U 11O 12U"
      crema: "1U 2O 5U 9U 6O 19O 16U 15O 13O 14U 15U 16O 17O 18U 19U"
    resaltar: {desde: "crema-vuelta1[0]", hasta: fin}

  - titulo: Mete el chicote de la crema
    texto: >-
      Mételo por dentro de sus dos vueltas, por encima de las dos cuerdas, y sácalo hacia
      la izquierda. Tira de los dos firmes para que los nudos se junten y se traben.
    trazado:
      azul: [azul-firme, azul-vuelta1, azul-vuelta2, azul-mete]
      crema: [crema-firme, crema-vuelta1, crema-vuelta2, crema-mete]
    secuencia:
      azul: "13U 14O 17U 21U 18O 7O 8U 4U 3O 1O 12O 11U 2U 3U 4O 5O 10O 6U 7U 8O 9O 10U 11O 12U"
      crema: "1U 2O 5U 9U 6O 19O 20U 16U 15O 13O 24O 23U 14U 15U 16O 17O 22O 18U 19U 20O 21O 22U 23O 24U"
    resaltar: {desde: "crema-mete[0]", hasta: fin}

# El error más común: meter el chicote por debajo de las dos cuerdas, por fuera de las
# vueltas. Es el paso 4 con los cruces 8 y 9 invertidos; así no queda ningún nudo.
error:
  paso: 4
  invierte: [8, 9]
  titulo: El chicote por debajo de las cuerdas
  texto: >-
    Pasaste el chicote por debajo de las dos cuerdas, por fuera de las vueltas. Así no
    queda nudo: al tirar, las vueltas se desarman. Vuelve a meterlo por encima de las dos
    cuerdas.
  encuadre:
    x: [-0.6, 16.4]
    y: [-5.5, 5.5]
  otros:
    - titulo: El chicote por una sola vuelta
      texto: >-
        El chicote tiene que pasar por dentro de las dos vueltas. Si pasa solo por una, el
        nudo queda flojo y se puede correr.
    - titulo: Los chicotes muy cortos
      texto: >-
        Si dejas poco chicote, un nudo se puede correr hasta la punta y salirse al
        apretarlo. Deja por lo menos el ancho de tu mano después de cada nudo.

# El nudo terminado, apretado, se muestra por delante y por detrás.
terminado:
  encuadre:
    x: [-16.4, 16.4]
    y: [-5.2, 5.2]
