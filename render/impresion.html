<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Impresión</title>
<link rel="icon" href="data:,">
<!-- Página que dibuja una sola imagen de impresión con la escena del visor (escena.js).
     La usa nudos/imprimir.py con Chrome sin interfaz; no se publica en el sitio.
     Las medidas están en puntos de impresión: la página se abre al tamaño en px que tiene
     la imagen a 300 ppp, así que 1 pt = 300/72 px. -->
<style>
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("recursos/vendor/fuentes/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
:root { --pt: calc(300px / 72); --ink: #16202f; }
html, body { margin: 0; background: #fff; }
.stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; }
.tags { position: absolute; inset: 0; }
.lineas { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lineas line { stroke: var(--ink); stroke-opacity: 0.7; stroke-width: calc(0.6 * var(--pt)); }
.tag {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  padding: calc(1.2 * var(--pt)) calc(3 * var(--pt)); border-radius: calc(1.5 * var(--pt));
  font: 400 calc(8 * var(--pt))/1.2 "IBM Plex Mono", monospace;
  text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--ink); background: rgba(255, 255, 255, 0.9);
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="tags">
    <svg class="lineas"><line id="lineFirme" visibility="hidden"/><line id="lineChicote" visibility="hidden"/></svg>
    <span class="tag" id="tagFirme" hidden>Firme</span>
    <span class="tag" id="tagChicote" hidden>Chicote</span>
  </div>
</div>
<script type="module" src="impresion.js"></script>
</body>
</html>
