# Vuelta de braza o leñador sobre un poste. Borrador de la skill nudo-nuevo.
# Trazado propio: las fotos de entradas/vuelta-de-braza y la página 03 del manual de la Tropa
# solo se usaron para leer el método y los cruces.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa, z hacia arriba.
# El poste va a lo largo de x, con el eje en y = 0. Sobre el poste, los puntos son
# [x, ángulo]: 0° arriba, 90° hacia quien ata, 180° abajo y 270° atrás.
# Los segmentos salen de rectas y arcos sobre la superficie desenrollada del poste, con
# puntos cada medio diámetro.
slug: vuelta-de-braza
nombre: Vuelta de braza
otros_nombres: [leñador]
familia: De sujeción
# De info.txt, sin confirmar.
abok: 1665

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Sujeta una cuerda a un tronco, un palo o un atado de leña para arrastrarlo o levantarlo.
  Se hace rápido y, cuando dejas de tirar, se deshace casi solo. Con ella empieza el amarre
  diagonal.
materiales: >-
  Una cuerda de unos 2 m y un palo grueso o un tronco, de 5 a 10 cm de ancho.
verificacion:
  - El chicote rodea el firme y después se enrolla tres veces en su propio tramo, no en el firme.
  - Las tres vueltas del chicote quedan juntas y apretadas contra el palo.
  - Al tirar del firme, la vuelta se cierra sobre el palo y el nudo no se corre.
precauciones:
  - >-
    Solo aguanta mientras el firme tira. Si la cuerda se afloja, el nudo se suelta: no lo
    uses para algo que tenga que quedar atado.
  - En un palo liso o con una cuerda resbalosa, el chicote se puede salir. Dale más vueltas.
  - >-
    Para arrastrar un tronco largo, pasa además un cote alrededor del tronco, cerca de la
    punta hacia la que tiras, para que el tronco no se atraviese.
alternativas:
  - nudo: Media llave y dos cotes
    cuando: >-
      Cuando la cuerda va a quedar atada mucho tiempo o a ratos se afloja: no se suelta sola
      y se desata fácil.
  - nudo: Constrictor
    cuando: >-
      Cuando quieres que quede apretado aunque nada tire, como para cerrar un atado de leña:
      no se suelta, pero cuesta desatarlo.

# Un palo grueso: de radio 4,5, como en las fotos. En uno delgado, las tres vueltas del
# chicote no caben en la cara del palo que se ve.
anfitrion:
  tipo: poste
  radio: 4.5
  desde: -26
  hasta: 26

# Zona que se muestra en todos los pasos.
