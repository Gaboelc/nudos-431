pasos:
  - titulo: Prepara la cuerda
    texto: >-
      El nudo va en medio de la cuerda, así que los dos extremos son firmes. Dobla un seno de
      unos 80 cm, con los dos firmes juntos hacia ti.
    trazado: [firme-a, sube-1, punta-1, baja-1, firme-b]
    secuencia: ""

  - titulo: Cruza los firmes
    texto: >-
      Justo debajo del seno, cruza los dos firmes: el de la derecha pasa por encima del otro,
      hacia la izquierda. Arriba del cruce queda un lazo.
    trazado: [firme-a, a-2, lazo-2, b-2, firme-b]
    secuencia: "1U 1O"
    resaltar: {desde: "a-2[0]", hasta: "b-2[-1]"}

  - titulo: Baja el lazo por detrás
    texto: >-
      Lleva la punta del lazo hacia ti, por debajo de los dos firmes. Ahora tienes un lazo a
      cada lado, unidos abajo por el tramo que pasa bajo los firmes.
    trazado: [firme-a, a-3, lob-der-3, h, lob-izq-3, b-3, firme-b]
    secuencia: "2O 1U 3U 2U 1O 3O"
    resaltar: {desde: "lob-der-3[0]", hasta: "lob-izq-3[-1]"}

  - titulo: Dobla el lazo de la izquierda
    texto: >-
      Dobla el lazo de la izquierda sobre los firmes, hacia la derecha, como la página de un
      libro. Queda dentro del otro lazo, y abajo a la izquierda se forma un lazo pequeño.
    trazado: [firme-a, a-centro, afuera-4, h, cl-bulto, d-centro, l2-abajo, l2-arriba, b-centro, firme-b]
    secuencia: "2O 4U 3U 2U 4O 5O 5U 3O"
    resaltar: {desde: "cl-bulto[0]", hasta: "l2-arriba[-1]"}

  - titulo: Dobla el lazo de la derecha
    texto: >-
      Ahora dobla el lazo grande de la derecha hacia la izquierda, por encima de todo. Quedan
      dos lazos arriba y uno abajo, en el centro, por donde pasan los firmes.
    trazado: [firme-a, a-centro, l1-arriba, l1-abajo, e-centro, cr-bulto, h, cl-bulto, d-centro, l2-abajo, l2-arriba, b-centro, firme-b]
    secuencia: "2O 4U 6U 6O 7O 8O 3U 2U 4O 7U 5O 5U 8U 3O"
    resaltar: {desde: "l1-arriba[0]", hasta: "cr-bulto[-1]"}

  - titulo: Sube los lados por los lazos
    texto: >-
      Sube cada lado del lazo de abajo por el lazo de arriba de su lado: por encima del borde
      de abajo y por debajo del de arriba. Asoman dos puntas.
    trazado: [firme-a, a-centro, l1-arriba, l1-abajo, e-centro, cr-pata-e, cr-punta-6, cr-pata-h, h, cl-pata-h, cl-punta-6, cl-pata-d, d-centro, l2-abajo, l2-arriba, b-centro, firme-b]
    secuencia: "2O 4U 6U 11O 10O 9U 12U 6O 7O 8O 13O 14U 15U 16O 3U 2U 9O 10U 11U 12O 4O 7U 5O 13U 16U 15O 14O 5U 8U 3O"
    # Empieza y termina fuera de los cruces 9 a 16: los lazos de los costados quedan azules y
    # se ve por dónde pasa cada lado. Es lo que compara la imagen del error.
    resaltar: {desde: "cr-pata-e[0]", hasta: "cl-pata-d[-1]"}

  - titulo: Forma las gazas
    texto: >-
      Tira de las dos puntas hasta que las gazas tengan el tamaño que necesitas. Después
      sostenlas y tira de los dos firmes a la vez, de a poco, hasta que el nudo quede firme.
    trazado: [firme-a, a-centro, l1-arriba, l1-abajo, e-centro, cr-pata-e, cr-gaza, cr-pata-h, h, cl-pata-h, cl-gaza, cl-pata-d, d-centro, l2-abajo, l2-arriba, b-centro, firme-b]
    secuencia: "2O 4U 6U 11O 10O 9U 12U 6O 7O 8O 13O 14U 15U 16O 3U 2U 9O 10U 11U 12O 4O 7U 5O 13U 16U 15O 14O 5U 8U 3O"
    resaltar: {desde: "cr-gaza[0]", hasta: "cl-gaza[-1]"}

# El error más común: subir los lados al revés, por debajo del borde de abajo y por encima del
# de arriba. Es el paso 6 con los cruces 9 a 16 invertidos.
error:
  paso: 6
  invierte: [9, 10, 11, 12, 13, 14, 15, 16]
  titulo: Los lados subieron al revés
  texto: >-
    Subiste los lados del lazo de abajo por debajo del borde de abajo de los lazos, y no por
    encima. Así los lazos no los abrazan y el nudo no queda armado. Sácalos y vuelve a
    subirlos: por encima del borde de abajo y por debajo del de arriba.
  encuadre:
    x: [-10.5, 10.5]
    y: [-4.5, 11.5]
  otros:
    - titulo: Apretarlo de un solo lado
      texto: >-
        Si tiras de una sola gaza, la cuerda pasa de una gaza a la otra y quedan de distinto
        tamaño. Sostén las dos gazas y tira de los dos firmes a la vez.

# El nudo terminado se muestra por delante y por detrás.
terminado:
  encuadre:
    x: [-14.5, 14.5]
    y: [-6.0, 17.0]
