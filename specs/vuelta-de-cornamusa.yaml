# Vuelta de cornamusa: asegura una cuerda a una cornamusa, como una driza o el cabo de un bote.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa, z hacia arriba.
# La cornamusa va a lo largo de x, centrada en x = y = 0, con el pie entre x = -2,5 y 2,5.
# Sobre la barra, los puntos son [x, ángulo]: 0° arriba, 90° hacia quien ata, 180° abajo
# (bajo un cuerno) y -90° atrás. El firme llega desde la izquierda, por delante; el cuerno
# lejano es el derecho.
slug: vuelta-de-cornamusa
nombre: Vuelta de cornamusa
familia: De sujeción

usos: >-
  Asegura una cuerda a una cornamusa, como la driza que sube una bandera o una vela, o el
  cabo de un bote en el muelle. Aguanta tirones y se suelta en un momento, aunque la cuerda
  esté tensa.
materiales: >-
  Una cuerda de 1 a 2 m y una cornamusa fija a una tabla o a un mástil.
verificacion:
  - Por encima de la cornamusa, las dos diagonales se cruzan en el medio, como una X.
  - La cuerda pasó una vez bajo cada cuerno antes de la primera diagonal.
  - El chicote sale por debajo de la última diagonal, apretado contra la cornamusa.
  - Al tirar del firme, nada se corre y el cote no se suelta.
precauciones:
  - >-
    Con la cuerda tensa, no pongas los dedos entre la cuerda y la cornamusa: si la carga
    tira de golpe, te los aprieta.
  - >-
    No le agregues cotes ni vueltas de más: se atasca y después no la puedes soltar rápido,
    que es justo lo que importa en una driza.
  - Deja el resto de la cuerda ordenado y libre, para que corra sin enredarse al soltarla.
alternativas:
  - nudo: Media llave y dos cotes
    cuando: Cuando no hay cornamusa y tienes que asegurar la cuerda a una argolla o un poste.
  - nudo: Ballestrinque
    cuando: Cuando la cuerda va a un palo o una baranda y no a una cornamusa.

anfitrion: {tipo: cornamusa, radio: 1, largo: 16}

# Zona que se muestra en todos los pasos.
encuadre:
  x: [-12.0, 11.0]
  y: [-8.0, 7.5]

segmentos:
  # El firme llega por delante, a lo largo de la cornamusa, y pasa bajo el cuerno derecho.
  firme: [[-18, -3.8], [-12, -3.7], [-6, -3.6], [-1, -3.5], [1.6, -3.1], [2.9, -2.2],
          [3.6, -1.0], [3.85, 0.2]]
  punta-1: [[4.2, -3.0], [6.8, -3.2], [9.0, -3.3]]
  sale-2: [[3.9, 1.3], [4.3, 3.0], [5.0, 5.0]]
  # Rodea el pie por detrás y pasa bajo el cuerno izquierdo, de atrás hacia delante.
  atras: [[3.6, 1.4], [2.9, 2.25], [1.8, 2.65], [0, 2.75], [-1.8, 2.65], [-2.9, 2.2],
          [-3.5, 1.3], [-3.65, 0.2]]
  bajo-izq: [[-3.7, -0.9], [-3.9, -2.2], [-4.25, -3.5]]
  lejos-3: [[-4.5, -4.4], [-5.2, -6.2], [-6.0, -8.0]]
  # Vuelve hacia la cornamusa, otra vez por encima del firme.
  vuelta: [[-4.6, -4.5], [-4.2, -6.3], [-3.0, -6.8], [-1.8, -6.3], [-1.3, -5.1],
           [-1.25, -3.6]]
  # Primera diagonal: de delante a la izquierda hasta atrás a la derecha, y bajo el cuerno
  # derecho, más cerca de la punta que la primera vez.
  diagonal-1:
    cornamusa: [[-1.2, 68], [-0.7, 44], [0.0, 20], [0.7, 0], [1.4, -22], [2.4, -55], [3.6, -85],
                [4.5, -115], [5.1, -150], [5.45, -180]]
  sale-4: [[5.6, -1.3], [6.0, -2.8], [6.8, -4.6], [7.8, -6.4]]
  # Segunda diagonal: sube por delante y cruza a la primera en el medio, hacia atrás a la
  # izquierda.
  diagonal-2:
    cornamusa: [[5.6, -215], [5.5, -250], [5.0, -285], [3.7, -310], [2.1, -340], [0.6, -370],
                [-1.0, -400], [-2.3, -425], [-3.6, -450]]
  lejos-5: [[-4.3, 3.3], [-5.0, 5.2], [-5.8, 7.2]]
  # El cote: rodea el cuerno izquierdo y el chicote sale por debajo de la segunda diagonal.
  cote:
    cornamusa: [[-4.3, -470], [-4.9, -500], [-5.4, -540], [-5.8, -580], [-6.1, -630],
                [-6.3, -680], [-6.2, -720], [-5.4, -738], [-4.5, -745], [-3.5, -748],
                [-2.7, -756], [-2.1, -772], [-1.6, -798], [-1.1, -828]]
  chicote-6: [[-0.4, 3.1], [0.8, 4.0], [3.0, 4.5], [6.0, 4.9], [9.5, 5.2]]

pasos:
  - titulo: Prepara la cuerda
    texto: >-
      Pon la cuerda por delante de la cornamusa, a lo largo de ella. El firme es el tramo
      que viene de la carga, a tu izquierda; el chicote es el extremo libre. Deja un metro
      de chicote.
    trazado: ["firme[:5]", punta-1]
    secuencia: ""

  - titulo: Pasa bajo el cuerno lejano
    texto: >-
      Pasa el chicote por debajo del cuerno de la derecha, el más lejos del firme, de
      delante hacia atrás.
    trazado: [firme, sale-2]
    secuencia: ""
    resaltar: {desde: "firme[5]", hasta: fin}

  - titulo: Rodea el pie
    texto: >-
      Lleva el chicote por detrás del pie y pásalo por debajo del otro cuerno, hacia ti.
      Sácalo por encima del firme.
    trazado: [firme, atras, bajo-izq, lejos-3]
    secuencia: "1U 1O"
    resaltar: {desde: "atras[0]", hasta: fin}

  - titulo: Cruza por encima
    texto: >-
      Vuelve con el chicote por encima del firme y súbelo a la cornamusa. Crúzala en
      diagonal hacia el cuerno de la derecha y pásalo por debajo de él, hacia ti.
    trazado: [firme, atras, bajo-izq, vuelta, diagonal-1, sale-4]
    secuencia: "1U 2U 3U 1O 2O 3O"
    resaltar: {desde: "vuelta[0]", hasta: fin}

  - titulo: Cruza otra vez
    texto: >-
      Sube el chicote por delante y cruza la cornamusa en la otra diagonal, por encima de
      la primera, hacia atrás a la izquierda. Las dos forman una X.
    trazado: [firme, atras, bajo-izq, vuelta, diagonal-1, diagonal-2, lejos-5]
    secuencia: "1U 2U 4U 3U 6U 1O 2O 5U 3O 4O 5O 6O"
    resaltar: {desde: "diagonal-2[0]", hasta: fin}

  - titulo: Remata con un cote
    texto: >-
      Tuerce una gaza en el chicote de modo que el chicote quede por debajo, y engánchala
      en el cuerno de la izquierda. Tira del chicote para ajustar.
    trazado: [firme, atras, bajo-izq, vuelta, diagonal-1, diagonal-2, cote, chicote-6]
    secuencia: "1U 2U 4U 3U 10U 6U 8U 1O 2O 5U 3O 4O 5O 9O 6O 7U 7O 8O 9U 10O"
    resaltar: {desde: "cote[0]", hasta: fin}

# El error más común: la gaza torcida al revés, con el chicote por encima.
error:
  paso: 6
  invierte: [9]
  titulo: El cote al revés
  texto: >-
    Torciste la gaza hacia el otro lado y el chicote quedó por encima de la diagonal. Así
    no se traba y la vuelta se suelta. Sácala, tuércela al revés y engánchala otra vez.
  otros:
    - titulo: Empezar por el cuerno cercano
      texto: >-
        Si la primera pasada va bajo el cuerno más cerca del firme, la cuerda no rodea la
        cornamusa y la carga queda sobre un solo cuerno. Empieza siempre por el lejano.
    - titulo: Llenarla de vueltas
      texto: >-
        Con muchas diagonales o varios cotes la vuelta se atasca y no se suelta rápido.
        Con dos diagonales y un cote basta.

terminado:
  encuadre:
    x: [-10.0, 9.0]
    y: [-6.5, 6.5]

estado: cuerda-ok

# Los filtros humanos. El filtro 2 está en pausa desde el 9 de noviembre de 2026.
filtros:
  - filtro: 1
    fecha: 2026-11-23
    resultado: aprobado
    ficha: a466e91
