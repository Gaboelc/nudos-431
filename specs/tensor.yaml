pasos:
  - titulo: Prepara la cuerda
    texto: >-
      El firme sube hacia lo que vas a sujetar y el palo queda abajo. Deja entre los dos un
      seno largo de cuerda floja. El chicote queda a la derecha, con unos 2 m.
    trazado: [firme, recto-1]
    secuencia: ""

  - titulo: Haz un lazo en el firme
    texto: >-
      A unos dos palmos del palo, haz un lazo chico con el firme: la cuerda que baja pasa
      por encima y el lazo queda a la derecha.
    trazado: [firme, anillo, bajada, sube-2]
    secuencia: "1O 1U"
    resaltar: {desde: "anillo[0]", hasta: "anillo[-1]"}

  - titulo: Haz un lazo del otro lado
    texto: >-
      Al otro lado del seno, haz un segundo lazo: la cuerda que sube desde el seno pasa por
      encima de la que sigue hacia el chicote.
    trazado: [firme, anillo, bajada, sube-3]
    secuencia: "1O 1U 2O 2U"
    resaltar: {desde: "sube-3[0]", hasta: "sube-3[26]"}

  - titulo: Mete el segundo lazo en el primero
    texto: >-
      Mete la punta del segundo lazo en el primero: por encima de su borde de abajo y por
      debajo del de arriba. El seno que queda colgando hará de polea.
    trazado: [firme, anillo, bajada, sube-4, cola-4]
    secuencia: "1O 6U 3U 4O 5O 1U 2O 3O 4U 5U 6O 2U"
    resaltar: {desde: "sube-4[0]", hasta: "sube-4[-1]"}

  - titulo: Rodea el palo y sube por el seno
    texto: >-
      Baja el chicote, dale una vuelta al palo y súbelo por dentro del seno que cuelga: por
      debajo de su fondo y por encima de su rama izquierda.
    trazado: [firme, anillo, bajada, sube-4, baja, vuelta-1, sube-5, cola-5]
    secuencia: "1O 6U 3U 4O 5O 1U 8U 7O 2O 3O 4U 5U 6O 2U 7U 8O"
    resaltar: {desde: "baja[0]", hasta: fin}

  - titulo: Tensa y da otra vuelta
    texto: >-
      Tira del chicote hasta que el firme quede tenso. Sin soltarlo, dale otra vuelta al palo
      y súbelo. Mantenlo tenso y asegúralo con dos cotes.
    trazado: [firme, anillo, bajada, sube-4, baja, vuelta-1, sube-5, baja-6, vuelta-2, sube-6]
    secuencia: "1O 6U 3U 4O 5O 1U 8U 7O 2O 3O 4U 5U 6O 2U 7U 8O"
    resaltar: {desde: "baja-6[0]", hasta: fin}

# El error: la fuente no trae uno. El segundo lazo queda debajo del primero sin pasar por
# dentro, así que nada lo sujeta.
error:
  paso: 4
  invierte: [3, 6]
  titulo: El segundo lazo no entra
  texto: >-
    Dejaste el segundo lazo debajo del primero, sin meterlo. Al tirar, el primero no lo
    aprieta y el nudo se desarma. Su punta pasa por encima del borde de abajo del primer
    lazo y por debajo del de arriba.
  otros:
    - titulo: El nudo muy cerca del palo
      texto: >-
        Si haces el nudo muy cerca del palo, el seno llega al palo antes de que la cuerda
        quede tensa y ya no puedes tirar más. Hazlo más lejos.
    - titulo: Soltar el chicote
      texto: >-
        Si sueltas el chicote antes de asegurarlo, la cuerda se afloja. Sujétalo tenso hasta
        rematarlo.
  encuadre:
    x: [-5.5, 5.5]
    y: [5.0, 24.0]

terminado:
  encuadre:
    x: [-10.0, 11.0]
    y: [-4.0, 24.0]

