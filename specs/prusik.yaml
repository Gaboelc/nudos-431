# Prusik: un anillo de cordino que agarra una cuerda más gruesa. Se dibuja libre, con dos
# cuerdas y sin anfitrión: la gruesa va recta y el anillo de cordino sale del encuadre por
# la izquierda, hacia el pescador doble que lo cierra. Trazado propio: las fotos de
# referencia solo se usaron para leer la topología.
# Unidades: diámetros del cordino. x a la derecha, y hacia el fondo de la mesa.
slug: prusik
nombre: Prusik
familia: De sujeción
abok: 1763

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Un anillo de cordino agarra una cuerda más gruesa en cualquier punto. Suelto, se corre
  por la cuerda; con carga, se aprieta y no se mueve, tires hacia donde tires.
materiales: >-
  Una cuerda de 10 a 12 mm, tendida, y 1,5 m de cordino de 5 o 6 mm cerrado con un
  pescador doble.
verificacion:
  - Tres vueltas arriba y tres abajo de los tramos, lado a lado.
  - Los tramos salen del medio, por encima de la gaza.
  - Al tirar de los tramos, el nudo agarra y no se corre.
precauciones:
  - Si el cordino es casi tan grueso como la cuerda, no agarra.
  - Con la cuerda mojada o muy lisa agarra menos. Dale una vuelta más.
  - Si corre apretado, el roce puede quemar el cordino.
alternativas:
  - nudo: Ballestrinque doble
    cuando: Cuando no tienes cordino y se tira hacia un solo lado.
  - nudo: Presilla de alondra
    cuando: Para colgar el anillo de un palo o una argolla.
seguridad: >-
  En escalada y rescate se usa para subir por una cuerda o frenar una caída. Aquí es solo
  conocimiento: en las actividades del grupo no lo uses para sostener, subir ni bajar a
  nadie. Practícalo sin carga o con un objeto. La práctica con personas se hace únicamente
  con instructor y equipo certificados.

# Estado de producción (ver «Estado» en docs/formato-spec.md).
estado: cuerda-ok

# Los filtros humanos. El filtro 2 está en pausa desde el 9 de noviembre de 2026.
filtros:
  - filtro: 1
    fecha: 2026-11-16
    resultado: aprobado
    ficha: 516a24c

cuerdas:
  - {nombre: gruesa, grosor: 1.5, color: azul}
  - {nombre: cordino, grosor: 1, color: crema}

encuadre:
  x: [-10.0, 5.0]
  y: [-28.0, 28.0]

# La gruesa, recta. El cordino es un anillo: sus dos tramos llegan desde la izquierda,
# desde el pescador doble, que queda fuera del encuadre, y la gaza es su otro extremo.
# Cada vuelta cruza la gruesa en diagonal, a 50°, primero por encima y luego por debajo;
# las vueltas de arriba y las de abajo son una el espejo de la otra. Entre una vuelta y la
# siguiente, el cordino da la vuelta junto a la gruesa con radio 2.
# Generado con rectas y arcos cada medio diámetro. Entre cruce y cruce, la gruesa se
# desvía hasta 0,4 de su eje: es el largo que necesita para subir y bajar sobre el cordino,
# y al relajar queda recta en la mesa.
