# As de guía español. Borrador de la skill nudo-nuevo. Trazado propio: las fotos de referencia
# solo se usaron para leer la topología (qué tramo pasa por encima en cada cruce).
#
# El nudo va en un seno, en medio de la cuerda, así que tiene dos firmes y ningún chicote
# (`dos_firmes`). Los dos salen juntos hacia ti. La cuerda se recorre desde el de la izquierda
# hasta el de la derecha.
#
# Se ata con el método de la fuente: se cruzan los firmes, el lazo baja por detrás de ellos, se
# doblan las dos mitades sobre el centro y cada lado del lazo de abajo sube por el lazo de su
# costado. Ese lado es la gaza, y el lazo del costado la abraza como un collar. Cruces:
#  1 los firmes (el de la derecha encima); desaparece al doblar la primera mitad.
#  2, 3 el seno de abajo pasa bajo los dos firmes.
#  4, 5 la primera mitad doblada pasa sobre los firmes; 6, 8 la segunda, también, y 7 es
#    donde la segunda pasa sobre la primera.
#  9 a 12 el lado izquierdo del lazo de abajo sube por el lazo de la izquierda: pasa sobre el
#    borde de abajo (9, 12) y bajo el de arriba (10, 11). 13 a 16, lo mismo a la derecha.
slug: as-de-guia-espanol
nombre: As de guía español
familia: Gazas
abok: 1087
dos_firmes: true

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Forma dos gazas fijas en medio de la cuerda, sin usar los extremos. Las dos quedan juntas,
  una a cada lado, y no se cierran cuando tiras de los firmes. Sirve para colgar o levantar
  un objeto largo, como una tabla o un tronco, con una gaza en cada extremo.
materiales: >-
  Una cuerda de unos 3 m: el nudo va en el medio. Para aprender, usa una de 6 a 10 mm de
  grosor que no sea rígida.
verificacion:
  - Las dos gazas salen hacia arriba, una a cada lado, y los dos firmes salen juntos hacia abajo.
  - Junto al nudo, cada gaza pasa por un lazo pequeño que la abraza.
  - Las dos gazas quedaron del tamaño que necesitas.
  - Si sostienes las gazas y tiras de los dos firmes, las gazas no se cierran ni se corren.
seguridad: >-
  En rescate, este nudo se usa para sostener a una persona, con una gaza en cada pierna. En
  este libro eso es solo conocimiento: en las actividades del grupo no lo uses para sostener,
  subir ni bajar a nadie. Esa práctica se hace únicamente con instructor y equipo certificados.
# Texto propio: los cuidados que ya dice «seguridad» no se repiten aquí.
precauciones:
  - Carga las dos gazas por igual. Si cargas una sola, la cuerda de la otra se puede correr
    hacia ella, y una gaza crece mientras la otra se achica.
  - Apriétalo bien antes de cargarlo. Flojo, se deforma.
  - El tamaño de las gazas se arregla antes de apretar. Si ya está apretado, aflójalo primero.
alternativas:
  - nudo: Mariposa alpina
    cuando: Cuando necesitas una sola gaza en medio de la cuerda.
  - nudo: As de guía
    cuando: Cuando te basta una gaza en el extremo de la cuerda.
  - nudo: Silla de bombero
    cuando: Cuando necesitas ajustar el tamaño de cada gaza antes de fijarla.

