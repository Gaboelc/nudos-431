# Media llave y dos cotes sobre un poste. Borrador de la skill nudo-nuevo.
# Trazado propio: las fotos de entradas/media-llave-y-dos-cotes solo se usaron para leer el
# método y los cruces. Las fotos miran el poste desde su punta; aquí el poste va acostado y
# los dos cotes quedan sobre la mesa, alrededor del firme, que sale hacia quien ata.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa, z hacia arriba.
# El poste va a lo largo de x, con el eje en y = 0. Sobre el poste, los puntos son
# [x, ángulo]: 0° arriba, 90° hacia quien ata, 180° abajo y 270° atrás.
slug: media-llave-y-dos-cotes
nombre: Media llave y dos cotes
familia: De sujeción
# De info.txt, sin confirmar.
abok: 1720

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Sujeta una cuerda a un poste, un árbol o una argolla, aunque la carga tire fuerte o
  cambie de dirección, como un bote o el viento de una carpa. Se desata fácil.
materiales: >-
  Una cuerda de unos 2 m y un poste o un palo grueso.
verificacion:
  - El chicote da dos vueltas completas al poste antes de ir hacia el firme.
  - Los dos cotes rodean solo el firme, no las vueltas del poste.
  - Los dos cotes giran hacia el mismo lado y quedan juntos, uno al lado del otro.
  - Al tirar del firme, las vueltas aprietan el poste y los cotes no se corren.
precauciones:
  - >-
    Deja un chicote de por lo menos un palmo después del segundo cote. Si es más corto, el
    nudo se puede soltar cuando la cuerda se mueve mucho.
  - >-
    Si la carga es pesada o tira de a golpes, da una o dos vueltas más al poste antes de
    los cotes, o agrega un tercer cote.
  - >-
    Con una cuerda resbalosa, revisa de vez en cuando que los cotes sigan apretados contra
    las vueltas.
alternativas:
  - nudo: Ballestrinque
    cuando: >-
      Cuando la cuerda va a estar atada poco rato y quieres correrla o soltarla rápido.
  - nudo: Vuelta de braza
    cuando: >-
      Cuando vas a arrastrar o levantar un tronco y después quieres que se suelte solo.
  - nudo: Nudo de liberación rápida
    cuando: >-
      Cuando tienes que soltar la cuerda de un tirón, aunque esté cargada.

