# Tensor (trucker's hitch) sobre un poste. Borrador de la skill nudo-nuevo.
# Trazado propio: las imágenes de entradas/tensor solo se usaron para leer el método y los cruces.
# Unidades: diámetros de cuerda. x a la derecha, y hacia el fondo de la mesa, z hacia arriba.
# El poste va a lo largo de x, con el eje en y = 0. Sobre el poste, los puntos son
# [x, ángulo]: 0° arriba, 90° hacia quien ata, 180° abajo y 270° atrás.
# La foto se mira desde arriba: el firme sale por arriba (hacia el fondo) y el gancho de la
# foto es el poste, abajo. El nudo va en la cuerda, a unos 15 diámetros del poste.
# Con radio 2,5 de la cuerda alrededor del eje, 1 diámetro sobre el poste son 22,9°.
slug: tensor
nombre: Tensor
familia: De sujeción
# De info.txt, sin confirmar: la fuente dice que esta forma es una variante del 2126.
abok: 2126

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Tensa con fuerza una cuerda que sujeta una carga, como una lona sobre un carro, o un cordel
  entre dos árboles. El seno que cuelga del nudo trabaja como una polea, así que tiras con
  menos fuerza. Se suelta de un tirón de la punta del lazo de arriba.
materiales: >-
  Una cuerda de unos 4 m y un palo o una baranda firme de 3 a 5 cm de ancho. Para
  practicar, ata el firme a algo alto.
verificacion:
  - La punta del segundo lazo pasa por dentro del primero, y el primero la aprieta.
  - El chicote rodea el palo y sube por dentro del seno que cuelga.
  - Al tirar del chicote, el firme se tensa y el nudo de arriba no se corre.
  - Con el chicote suelto, al tirar de la punta del lazo de arriba el nudo se deshace.
precauciones:
  - Con una cuerda resbalosa, el nudo de arriba se suelta solo. Usa una que agarre.
  - >-
    El seno que hace de polea se gasta con el roce. Si tensas muchas veces, revisa la cuerda.
  - Multiplica tu fuerza; no tenses tanto que se rompa la cuerda, el palo o la carga.
alternativas:
  - nudo: Tensor ajustable
    cuando: Cuando solo necesitas ajustar una cuerda atada a una estaca, sin mucha fuerza.
  - nudo: Media llave y dos cotes
    cuando: Cuando solo hace falta atar la cuerda al palo, sin tensarla.

anfitrion:
  tipo: poste
  radio: 2
  desde: -11
  hasta: 4

