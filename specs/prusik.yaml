pasos:
  - titulo: Prepara el anillo
    texto: >-
      Pon el anillo junto a la gruesa, con el pescador doble lejos. Los tramos que van al
      pescador quedan quietos: trabajas con la gaza.
    trazado:
      gruesa: [gruesa]
      cordino: [tramo-1, gaza-suelta, tramo-2]
    secuencia:
      gruesa: ""
      cordino: ""
    resaltar: {desde: "gaza-suelta[0]", hasta: "gaza-suelta[-1]"}

  - titulo: Da la primera vuelta
    texto: >-
      Pasa la gaza por encima de la gruesa, por detrás y sácala por debajo de los tramos.
      Deja una hebra arriba de los tramos y otra abajo.
    trazado:
      gruesa: [gruesa]
      cordino: [tramo-1, llega, arriba-1, gaza-1, abajo-1, sale, tramo-2]
    secuencia:
      gruesa: "5O 6U 2U 3O"
      cordino: "1O 2O 3U 1U 4U 5U 6O 4O"
    resaltar: {desde: "arriba-1[0]", hasta: "abajo-1[-1]"}

  - titulo: Da la segunda vuelta
    texto: >-
      Repite: por encima, por detrás y por debajo de los tramos. Las vueltas nuevas van por
      fuera de las primeras.
    trazado:
      gruesa: [gruesa]
      cordino: [tramo-1, llega, arriba-1, arriba-2, gaza-2, abajo-2, abajo-1, sale, tramo-2]
    secuencia:
      gruesa: "9O 10U 5O 6U 2U 3O 7U 8O"
      cordino: "1O 2O 3U 7O 8U 1U 4U 9U 10O 5U 6O 4O"
    resaltar: {desde: "arriba-2[0]", hasta: "abajo-2[-1]"}

  - titulo: Da la tercera vuelta y aprieta
    texto: >-
      Repite otra vez. Junta las vueltas lado a lado, con los tramos al medio, y tira de
      los tramos.
    trazado:
      gruesa: [gruesa]
      cordino: [tramo-1, llega, arriba-1, arriba-2, arriba-3, gaza-3, abajo-3, abajo-2,
                abajo-1, sale, tramo-2]
    secuencia:
      gruesa: "13O 14U 9O 10U 5O 6U 2U 3O 7U 8O 11U 12O"
      cordino: "1O 2O 3U 7O 8U 11O 12U 1U 4U 13U 14O 9U 10O 5U 6O 4O"
    resaltar: {desde: "arriba-3[0]", hasta: "abajo-3[-1]"}

# El error más común: la gaza queda por encima de los tramos y no los traba.
error:
  paso: 2
  invierte: [1, 4]
  titulo: La gaza por encima de los tramos
  texto: >-
    La sacaste por encima de los tramos: nada traba las vueltas y se suelta. Sácala por
    debajo.
  encuadre:
    x: [-8.0, 3.5]
    y: [-7.5, 7.5]
  otros:
    - titulo: Vueltas montadas
      texto: Si una vuelta pisa otra, se corre de golpe. Acomódalas antes de apretar.

terminado:
  encuadre:
    x: [-8.0, 4.0]
    y: [-27.5, 27.5]
