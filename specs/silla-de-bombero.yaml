# Silla de bombero. Borrador de la skill nudo-nuevo. Trazado propio: las imágenes de referencia
# solo se usaron para leer la topología (qué tramo pasa por encima en cada cruce).
#
# El nudo va en medio de la cuerda, así que tiene dos firmes y ningún chicote (`dos_firmes`).
# Los dos llegan desde ti, uno a cada lado. La cuerda se recorre desde el de la izquierda hasta
# el de la derecha.
#
# Se ata como en la fuente: un lazo, otro igual encima del primero, el lado de cada lazo que
# queda dentro del otro se saca hacia afuera (son las gazas) y cada gaza se traba con un cote
# hecho con el firme de su lado. Sin los cotes es el nudo de esposas. Cruces:
#  1, 2 el cruce de abajo de cada lazo: el tramo que sube pasa por encima.
#  3, 4 donde se montan los dos lazos, abajo y arriba: el de la derecha va encima.
#  5, 6 la gaza de la izquierda pasa por debajo del lado izquierdo del primer lazo; 7, 8 la de
#    la derecha, por encima del lado derecho del segundo.
#  9 el lazo del firme de la izquierda; 10 a 13 su cote: el lado de adentro pasa por debajo de
#    las dos patas de la gaza y el de afuera, por encima. 14 a 18, lo mismo a la derecha.
# El nudo es simétrico: reflejado de izquierda a derecha, recorrido al revés y con los cruces
# invertidos, da la misma secuencia. Por eso la mitad derecha del trazado es el reflejo de la
# izquierda.
slug: silla-de-bombero
nombre: Silla de bombero
familia: Gazas
abok: 1100
dos_firmes: true

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Forma dos gazas en medio de la cuerda, una a cada lado, y traba cada una con un cote para
  que no se corra. Antes de trabarlas puedes ajustar el tamaño de cada gaza. Sirve para
  levantar o arrastrar un objeto largo, como un tronco o una tabla, con una gaza en cada
  extremo.
materiales: >-
  Una cuerda de unos 4 m: el nudo va en el medio y con los firmes se hacen los cotes. Para
  aprender, usa una de 6 a 10 mm de grosor que no sea rígida.
verificacion:
  - Las dos gazas salen del nudo, una a cada lado, y los dos firmes salen hacia ti.
  - Cada gaza pasa por un cote hecho con el firme de su lado, cerrado junto al nudo.
  - En cada cote, un lado pasa por encima de las dos patas de la gaza y el otro por debajo.
  - Las gazas quedaron del tamaño que necesitas.
  - Si tiras de una gaza, no se cierra ni se corre.
seguridad: >-
  En rescate, este nudo se usa para bajar a una persona sentada en una gaza, con la otra bajo
  los brazos. En este libro eso es solo conocimiento: en las actividades del grupo no lo uses
  para sostener, subir ni bajar a nadie. Practícalo sin carga o con un objeto. La práctica con
  personas se hace únicamente con instructor y equipo certificados.
# Texto propio: los cuidados que ya dice «seguridad» no se repiten aquí.
precauciones:
  - Ajusta el tamaño de las gazas antes de hacer los cotes. Con los cotes cerrados ya no se ajustan.
  - Sin los cotes, las gazas se corren. No cargues el nudo antes de trabarlas.
  - Cierra bien cada cote contra el nudo antes de cargarlo.
alternativas:
  - nudo: As de guía español
    cuando: Cuando necesitas dos gazas fijas en medio de la cuerda y no tienes que ajustarlas.
  - nudo: Mariposa alpina
    cuando: Cuando te basta una sola gaza en medio de la cuerda.

