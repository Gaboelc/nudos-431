pasos:
  - titulo: Rodea la estaca
    texto: >-
      El firme llega desde la derecha, del lado de la carpa. Pasa la cuerda por detrás de la
      estaca, a ras del suelo, y trae el chicote de vuelta hacia la derecha. Deja un chicote
      de un metro.
    trazado: [firme, firme-recto, vuelta, vuelve, suelto]
    secuencia: ""
    resaltar: {desde: "vuelta[0]", hasta: fin}
  - titulo: Da dos vueltas al firme
    texto: >-
      Dentro de la gaza, sube el chicote al firme y rodéalo dos veces, avanzando hacia la
      estaca: por debajo, por encima, por debajo y por encima.
    trazado: [firme, firme-afuera-recto, firme-torcido, firme-llega, vuelta, vuelve, sube,
              vueltas, fin-2]
    secuencia: "1O 2U 3O 4U 1U 2O 3U 4O"
    resaltar: {desde: "sube[0]", hasta: fin}
  - titulo: Pasa por fuera de las vueltas
    texto: >-
      Trae el chicote hacia ti y llévalo hacia la carpa: pásalo por debajo del tramo que sube
      a las vueltas y después por debajo del firme, más allá de las dos vueltas.
    trazado: [firme, firme-afuera, firme-junto, firme-torcido, firme-llega, vuelta, vuelve,
              sube, vueltas, sale, cruza-vuelve, sube-afuera, cruza-firme]
    secuencia: "6O 1O 2U 3O 4U 5O 1U 2O 3U 4O 5U 6U"
    resaltar: {desde: "sale[0]", hasta: fin}
  - titulo: Remata con una vuelta más
    texto: >-
      Vuelve con el chicote por encima del firme, hacia la estaca, y sácalo hacia la carpa
      por encima del tramo que sube al firme. Aprieta las vueltas y corre el nudo para
      tensar la cuerda.
    trazado: [firme, firme-afuera, firme-junto, firme-torcido, firme-llega, vuelta, vuelve,
              sube, vueltas, sale, cruza-vuelve, sube-afuera, tercera, remata]
    secuencia: "6O 7U 1O 2U 3O 4U 5O 1U 2O 3U 4O 5U 8U 6U 7O 8O"
    resaltar: {desde: "tercera[0]", hasta: fin}

error:
  paso: 2
  invierte: [2]
  titulo: Una vuelta que no rodea el firme
  texto: >-
    Si el chicote pasa dos veces seguidas por debajo del firme, no le da la vuelta y el nudo
    no se traba. En cada vuelta, el chicote pasa una vez por debajo y una por encima.
  otros:
    - titulo: El remate dentro de la gaza
      texto: >-
        La última vuelta va por fuera de las otras dos, más lejos de la estaca. Si la das junto
        a ellas, dentro de la gaza, el nudo se corre cuando la cuerda tira.
