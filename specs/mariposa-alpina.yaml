# Mariposa alpina. Borrador de la skill nudo-nuevo. Trazado propio: las fotos de referencia
# solo se usaron para leer la topología (qué tramo pasa por encima en cada cruce).
#
# El nudo va en medio de la cuerda, así que tiene dos firmes. La cuerda se recorre desde el
# que queda a la derecha y quieto («Firme» en las imágenes) y termina en el otro, que es el
# lado con que se trabaja: en las imágenes lleva «Chicote».
#
# La fuente lo ata enrollando la cuerda en la mano. Aquí se ata sobre la mesa, armando
# tramo por tramo la forma del nudo flojo, en el mismo orden que las vueltas a la mano.
slug: mariposa-alpina
nombre: Mariposa alpina
familia: Gazas
abok: 1053

# Lo que dice la ficha. Texto propio, en tuteo y sin términos de ninguna sección.
usos: >-
  Forma una gaza fija en medio de la cuerda, sin usar los extremos. Sirve para enganchar
  algo a una cuerda tendida, como un mosquetón, o para dejar fuera un tramo dañado, que
  queda en la gaza y no recibe carga. Aguanta tirones hacia cualquier lado y, aunque haya
  aguantado mucho, se desata con facilidad.
materiales: >-
  Una cuerda de unos 2 m: el nudo va en el medio. Para aprender, usa una de 6 a 10 mm de
  grosor que no sea rígida.
verificacion:
  - Los dos firmes salen del nudo hacia lados opuestos y la gaza sale entre ellos.
  - Si tiras de los dos firmes a la vez, la gaza no se cierra ni se corre.
  - La gaza aguanta un tirón hacia cualquiera de los dos firmes sin correrse.
  - La gaza quedó del tamaño que necesitas.
seguridad: >-
  En escalada y en rescate, este nudo se usa para que una persona se enganche en medio de
  una cuerda. En este libro eso es solo conocimiento: en las actividades del grupo no lo
  uses para sostener, subir ni bajar a nadie. Esa práctica se hace únicamente con
  instructor y equipo certificados.
# Texto propio: los cuidados que ya dice «seguridad» no se repiten aquí.
precauciones:
  - Apriétalo bien antes de cargarlo. Flojo, se deforma y se puede soltar.
  - El tamaño de la gaza se arregla antes de apretar. Si ya está apretado, aflójalo primero.
  - Si lo usas para dejar fuera un tramo dañado, ese tramo tiene que quedar en la gaza. Aun
    así, revisa la cuerda o cámbiala antes de volver a confiar en ella.
alternativas:
  - nudo: As de guía
    cuando: Cuando necesitas la gaza en el extremo de la cuerda y no en el medio.
  - nudo: Ocho doble
    cuando: Cuando necesitas la gaza en el extremo y tiene que aguantar mucho.

# Estado de producción (ver «Estado» en docs/formato-spec.md).
estado: cuerda-ok

# Los filtros humanos. El filtro 2 está en pausa desde el 9 de noviembre de 2026.
filtros:
  - filtro: 1
    fecha: 2026-11-12
    resultado: aprobado
    ficha: c2627a8

encuadre:
  x: [-12.60, 12.60]
  y: [-8.40, 17.80]

# Tallado, como el nudo armado de la foto antes de apretarlo: las vueltas del cuerpo van
# cerradas y solo la gaza y los firmes quedan grandes.
segmentos:
  # El firme llega desde la derecha, cerca de ti, y sube en diagonal hacia la izquierda.
  # Pasa por los cruces 4, 7, 2, 9 y 6.
  firme: [[31.20, -19.20], [24.00, -14.82], [18.00, -11.16], [13.44, -8.34], [10.08, -6.24],
          [7.44, -4.63], [5.28, -3.29], [3.84, -2.39], [2.34, -1.45], [0.00, 0.00],
          [-2.34, 1.45], [-3.84, 2.39], [-5.40, 3.36], [-6.48, 4.08]]
  # El chicote suelto antes de empezar.
  recto: [[-7.68, 4.84], [-9.36, 5.88], [-11.04, 6.92]]
  # El lazo de la izquierda: sube, da la vuelta y baja hacia el centro.
  lazo-izq: [[-7.25, 4.8], [-7.55, 5.75], [-7.3, 6.75], [-6.55, 7.5], [-5.5, 7.95],
             [-4.3, 8.05], [-3.1, 7.8], [-1.9, 7.65]]
  # Pasa por el cruce 1 y baja en diagonal hacia la derecha.
  t1: [[0.00, 6.90], [1.80, 5.82]]
  # El ojo pequeño, debajo del cruce 1 (pasos 3 y 4).
  ojo: [[2.5, 4.7], [2.6, 3.6], [1.9, 2.95], [0.95, 2.6], [0.0, 2.5], [-0.95, 2.6], [-1.9, 2.95], [-2.6, 3.6], [-2.5, 4.7]]
  # Sube hacia la derecha por encima del cruce 1.
  t2: [[-1.80, 5.76], [1.9, 7.65]]
  # El lazo de la derecha: da la vuelta y baja hacia el firme.
  lazo-der: [[3.1, 7.8], [4.3, 8.05], [5.5, 7.95], [6.55, 7.5], [7.3, 6.75], [7.55, 5.75],
             [7.25, 4.8], [6.48, 4.08]]
  # Cruza el firme en el cruce 2 y sigue hacia ti, a la izquierda.
  d2: [[5.34, 3.32], [3.84, 2.39], [-3.84, -2.39], [-5.28, -3.29], [-7.44, -4.63],
       [-9.60, -5.98], [-11.52, -7.16]]
  # El ojo bajado por encima de los dos tramos (pasos 5 y 6): el lado derecho pasa por los
  # cruces 3 y 4, y el izquierdo por el 5 y el 6.
  t1-baja: [[3.60, 4.62], [5.34, 3.42], [6.06, 2.46], [6.36, 1.08]]
  pata-der: [[6.55, -0.4], [6.55, -1.9], [6.25, -3.15], [5.75, -4.25]]
  fondo: [[4.9, -5.0], [3.5, -5.45], [1.8, -5.65], [0.0, -5.7], [-1.8, -5.65],
          [-3.5, -5.45], [-4.9, -5.0]]
  pata-izq: [[-5.75, -4.25], [-6.25, -3.15], [-6.55, -1.9], [-6.55, -0.4], [-6.36, 1.08],
             [-6.06, 2.46], [-5.34, 3.42], [-3.6, 4.56]]
  # La punta del ojo subida por debajo del cruce 2 (paso 6): las vueltas de abajo, los
  # cruces 7, 8, 9 y 10, y la gaza.
  rizo-der: [[5.1, -4.75], [4.0, -5.05], [3.05, -4.75], [2.6, -3.95], [2.5, -2.9],
             [2.5, -1.9], [2.5, 0.0], [2.44, 2.28]]
  gaza: [[2.11, 3.54], [1.19, 4.38], [0.0, 4.68], [-1.19, 4.38], [-2.11, 3.54]]
  rizo-izq: [[-2.44, 2.28], [-2.5, 0.0], [-2.5, -1.9], [-2.5, -2.9], [-2.6, -3.95],
             [-3.05, -4.75], [-4.0, -5.05], [-5.1, -4.75]]
  # La gaza sacada hacia el fondo (paso 7): sus dos patas pasan por encima de los dos
  # tramos que se cruzan en el cruce 1, en los cruces 11 a 14.
  gaza-larga: [[2.3, 4.0], [2.2, 5.5], [2.05, 7.0], [1.55, 14.6], [1.1, 15.7], [0.0, 16.2],
               [-1.1, 15.7], [-1.55, 14.6], [-2.1, 7.0], [-2.3, 5.5], [-2.35, 4.0]]

pasos:
  - titulo: Prepara la cuerda
    texto: >-
      El nudo va en medio de la cuerda: los dos extremos son firmes. Pon la cuerda en
      diagonal. El de la derecha queda quieto; con el otro lado, el chicote, trabajas.
      Deja de ese lado 1,5 m.
    trazado: [firme, recto]
    secuencia: ""

  - titulo: Haz un lazo
    texto: >-
      Lleva el chicote hacia el fondo, dale la vuelta hacia la derecha y bájalo en
      diagonal hacia el centro, formando un lazo a la izquierda. Todavía no cruza nada.
    trazado: [firme, lazo-izq, t1, "t1-baja[:2]"]
    secuencia: ""
    resaltar: {desde: "lazo-izq[0]", hasta: fin}

  - titulo: Haz un ojo pequeño
    texto: >-
      Gira el chicote hacia la izquierda y súbelo cruzando por encima del tramo que
      bajaba. Debajo del cruce queda un ojo pequeño.
    trazado: [firme, lazo-izq, t1, ojo, t2, "lazo-der[:2]"]
    secuencia: "1U 1O"
    resaltar: {desde: "ojo[0]", hasta: fin}

  - titulo: Cruza por encima del firme
    texto: >-
      Haz otro lazo, ahora a la derecha, y baja el chicote en diagonal hacia tu
      izquierda, por encima del firme.
    trazado: [firme, lazo-izq, t1, ojo, t2, lazo-der, d2]
    secuencia: "2U 1U 1O 2O"
    resaltar: {desde: "lazo-der[1]", hasta: fin}

  - titulo: Baja el ojo
    texto: >-
      Toma el ojo pequeño y bájalo hacia ti, por encima del cruce de abajo, hasta que
      quede debajo de él. Sus dos lados pasan por encima del firme y del chicote.
    trazado: [firme, lazo-izq, t1, t1-baja, pata-der, fondo, pata-izq, t2, lazo-der, d2]
    secuencia: "4U 2U 6U 1U 3O 4O 5O 6O 1O 3U 2O 5U"
    resaltar: {desde: "t1-baja[0]", hasta: "t2[0]"}

  - titulo: Súbelo por debajo
    texto: >-
      Mete la punta del ojo por debajo del cruce de abajo y súbela por el centro: esa
      punta es la gaza.
    trazado: [firme, lazo-izq, t1, t1-baja, pata-der, rizo-der, gaza, rizo-izq, pata-izq,
              t2, lazo-der, d2]
    secuencia: "4U 7O 2U 9O 6U 1U 3O 4O 7U 8U 9U 10U 5O 6O 1O 3U 8O 2O 10O 5U"
    # Empieza y termina fuera de los cruces 7 a 10: el firme y el chicote llegan azules y
    # se ve que la punta pasa por debajo. Es lo que compara la imagen del error.
    resaltar: {desde: "rizo-der[0]", hasta: "rizo-izq[-1]"}

  - titulo: Saca la gaza
    texto: >-
      Tira de la gaza hacia el fondo, por encima del cruce de arriba, hasta que salga del
      nudo. Después sostenla y tira de los dos firmes a la vez, de a poco, hasta que el
      nudo quede firme.
    trazado: [firme, lazo-izq, t1, t1-baja, pata-der, rizo-der, gaza-larga, rizo-izq,
              pata-izq, t2, lazo-der, d2]
    secuencia: "4U 7O 2U 9O 6U 11U 1U 12U 3O 4O 7U 8U 12O 13O 11O 14O 9U 10U 5O 6O 14U 1O 13U 3U 8O 2O 10O 5U"
    resaltar: {desde: "gaza-larga[0]", hasta: "gaza-larga[-1]"}

# El error más común: subir la punta por encima del cruce y no por debajo. Es el paso 6
# con los cruces 7 a 10 invertidos, y no queda nudo.
error:
  paso: 6
  invierte: [7, 8, 9, 10]
  titulo: La punta pasó por encima
  texto: >-
    Subiste la punta del ojo por encima del cruce de abajo, y no por debajo. Así no hay
    nudo: cuando tiras de los firmes, la cuerda se suelta. Saca la punta y vuelve a
    pasarla, ahora por debajo.
  encuadre:
    x: [-7.80, 7.80]
    y: [-6.60, 6.00]
  otros:
    - titulo: Apretarlo de un solo lado
      texto: >-
        Si tiras de un solo firme, el nudo se deforma y la gaza se corre. Sostén la gaza
        y tira de los dos firmes a la vez.
