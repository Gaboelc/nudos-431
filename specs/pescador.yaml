pasos:
  - titulo: Prepara las cuerdas
    texto: >-
      Pon las cuerdas lado a lado: la azul llega por la izquierda y la crema por la derecha.
      Deja unos 30 cm de cada chicote junto a la otra cuerda.
    trazado:
      azul: [azul-firme, azul-sigue, azul-recto, azul-u]
      crema: [crema-firme, crema-sigue, crema-recto, crema-u]
    secuencia:
      azul: ""
      crema: ""

  - titulo: Rodea las dos cuerdas con la crema
    texto: >-
      Lleva el chicote de la crema hacia el fondo por debajo de la azul. Rodea las dos
      cuerdas y vuelve hacia ti por encima de las dos.
    trazado:
      azul: [azul-firme, azul-sigue, azul-recto, azul-u]
      crema: [crema-firme, crema-sigue, crema-vuelta, crema-cae]
    secuencia:
      azul: "1O 2U"
      crema: "3U 1U 2O 3O"
    resaltar: {desde: "crema-vuelta[0]", hasta: fin}

  - titulo: Mete el chicote de la crema
    texto: >-
      Mételo por dentro de la vuelta: por debajo de las dos cuerdas y por encima de la
      vuelta. Sácalo hacia la izquierda y tira de él para cerrar el nudo.
    trazado:
      azul: [azul-firme, azul-sigue, azul-recto, azul-u]
      crema: [crema-firme, crema-sigue, crema-vuelta, crema-mete]
    secuencia:
      azul: "1O 5O 2U"
      crema: "3U 4O 1U 6U 2O 3O 4U 5U 6O"
    # Empieza después del cruce 3: en los cruces 4 y 5, la crema y la azul llegan sin
    # resaltar y el chicote pasa por debajo. Es lo que compara la imagen del error.
    resaltar: {desde: "crema-mete[0]", hasta: fin}

  - titulo: Rodea las dos cuerdas con la azul
    texto: >-
      Ahora con la azul: lleva su chicote hacia ti por debajo de la crema, rodea las dos
      cuerdas y vuelve por encima de las dos.
    trazado:
      azul: [azul-firme, azul-sigue, azul-vuelta, azul-cae]
      crema: [crema-firme, crema-sigue, crema-vuelta, crema-mete]
    secuencia:
      azul: "1O 5O 2U 9U 7U 8O 9O"
      crema: "7O 8U 3U 4O 1U 6U 2O 3O 4U 5U 6O"
    resaltar: {desde: "azul-vuelta[0]", hasta: fin}

  - titulo: Mete el chicote de la azul
    texto: >-
      Mételo por dentro de la vuelta, por debajo de las dos cuerdas y por encima de la
      vuelta. Sácalo hacia la derecha y cierra este nudo también.
    trazado:
      azul: [azul-firme, azul-sigue, azul-vuelta, azul-mete]
      crema: [crema-firme, crema-sigue, crema-vuelta, crema-mete]
    secuencia:
      azul: "1O 5O 2U 9U 10O 7U 12U 8O 9O 10U 11U 12O"
      crema: "7O 11O 8U 3U 4O 1U 6U 2O 3O 4U 5U 6O"
    resaltar: {desde: "azul-mete[0]", hasta: fin}

  - titulo: Junta los nudos
    texto: >-
      Tira de los dos firmes, uno hacia cada lado. Los nudos se corren hasta quedar uno
      contra el otro y se traban.
    trazado:
      azul: [azul-firme, azul-vuelta-6, azul-mete-6]
      crema: [crema-firme, crema-vuelta-6, crema-mete-6]
    secuencia:
      azul: "1O 5O 2U 9U 10O 7U 12U 8O 9O 10U 11U 12O"
      crema: "7O 11O 8U 3U 4O 1U 6U 2O 3O 4U 5U 6O"

# El error más común: meter el chicote por encima de las dos cuerdas, por fuera de la
# vuelta. Es el paso 3 con los cruces 4 y 5 invertidos; así no queda ningún nudo.
error:
  paso: 3
  invierte: [4, 5]
  titulo: El chicote por encima de las cuerdas
  texto: >-
    Pasaste el chicote por encima de las dos cuerdas, por fuera de la vuelta. Así no queda
    ningún nudo: cuando tiras, la vuelta se desarma. Sácalo y vuelve a meterlo, ahora por
    debajo de las dos cuerdas.
  encuadre:
    x: [-11.3, -1.5]
    y: [-4.9, 4.9]
  otros:
    - titulo: La vuelta solo alrededor de la otra cuerda
      texto: >-
        La vuelta tiene que rodear las dos cuerdas. Si rodea solo la otra, no se forma el
        nudo simple y la unión se corre al tirar.
    - titulo: Los chicotes muy cortos
      texto: >-
        Si dejas poco chicote, un nudo se puede correr hasta la punta y salirse al
        apretarlo. Deja por lo menos el ancho de tu mano después de cada nudo.

# El nudo terminado, apretado, se muestra por delante y por detrás.
terminado:
  encuadre:
    x: [-9.3, 9.3]
    y: [-5.0, 5.0]
